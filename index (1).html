.cal button.sel{background:var(--ac);color:var(--on);border-color:var(--ac)}

.cal button.sel .dot{background:var(--on)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px}

.login{max-width:400px;margin:24px auto 0}
.login h2{font-size:30px}
.login input{width:100%;text-align:center;font:700 28px "Barlow Condensed",sans-serif;letter-spacing:8px}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}

<script>
var SUPABASE_URL = 'https://jiudjwiicarrzrcpdknt.supabase.co';
var SUPABASE_KEY = 'sb_publishable_dnbpFKVkeng3AqfffTNLQg_kXT3C5qQ';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var DOW=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var PIX='454.430.958-11';
var FRASES=['Descanso também é treino: quem recupera bem, volta mais forte.','Começar é fácil. Constância é o que muda o seu corpo.','Disciplina é fazer mesmo quando a motivação não aparece.','Cada treino feito é um voto em quem você quer ser.','Resultado não nasce de um dia bom. Nasce da repetição.','Não negocie com a preguiça hoje. Amanhã você agradece.','Constância vence talento. Feche a semana com a sua melhor versão.'];
var TABS={p:[['agenda','🗓','Agenda'],['alunos','👥','Alunos'],['rep','🔁','Reposições'],['online','💻','Consultoria Online'],['pag','💰','Pagamentos']],a:[['inicio','🏠','Início'],['aulas','🗓','Aulas'],['rep','🔁','Reposições']]};

var S={alunos:[],aulas:[],reg:{},rep:[],pagos:{},vinc:{},tel:{},codigos:{},lemb:''};
var ui={role:'p',tab:'agenda',date:'',aluno:null,mon:null,day:'',sel:null,scope:null,login:'',authErr:'',authMode:'login',pixAt:0};
var SESSION=null,UID=null,OWNER=false,loaded=false,notified=false,pollTimer=null;

/* ---------- utilidades ---------- */
function pad(n){return(n<10?'0':'')+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function hoje(){return iso(new Date())}
function pd(s){return new Date(s+'T00:00')}
function rid(k){return String(k).replace(/[^A-Za-z0-9-]/g,'_')}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fd(s){var d=pd(s);return DOW[d.getDay()].slice(0,3)+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)}
function dmy(s){return String(s).split('-').reverse().join('/')}
function brl(v){return 'R$ '+Number(v||0).toFixed(2).replace('.',',')}
function val(id){var e=document.getElementById(id);return e?e.value:''}
function al(id){for(var i=0;i<S.alunos.length;i++)if(S.alunos[i].id===id)return S.alunos[i];return null}
function isPres(a){return !!a&&(a.tipo||'presencial')!=='online'}
function isOnl(a){return !!a&&a.tipo==='online'}
function mes(){return hoje().slice(0,7)}
function telOf(a){return S.tel[a.id]||''}
function codeOf(a){return S.codigos[a.id]||''}
function firstName(a){return String(a.nome||'').split(' ')[0]}
function waLink(tel,text){return 'https://wa.me/55'+tel+'?text='+encodeURIComponent(text)}
function byNome(x,y){return String(x.nome||'').localeCompare(String(y.nome||''),'pt-BR')}
function sortAula(x,y){return x.dow-y.dow||(x.h<y.h?-1:x.h>y.h?1:0)}
function linkedIds(){var o={};Object.keys(S.vinc).forEach(function(u){o[S.vinc[u]]=1});return o}
function newCode(){var c;do{c=String(100000+Math.floor(Math.random()*900000))}while(Object.keys(S.codigos).some(function(k){return S.codigos[k]===c}));return c}
function normTime(t){if(!t)return '';var p=String(t).split(':');return pad(parseInt(p[0],10)||0)+':'+pad(parseInt(p[1],10)||0)}

/* ---------- pagamentos ---------- */
function pay(a){
  var m=mes(),due=m+'-'+pad(Math.min(a.venc||10,28));
  if(S.pagos[a.id+'|'+m])return{s:'pago',due:due,d:0};
  var d=Math.round((pd(due)-pd(hoje()))/864e5);
  return{s:d<0?'atrasado':'aberto',due:due,d:d};
}
function ord(a){var p=pay(a);return p.s==='pago'?1e6:p.d}
function payTxt(a){
  var p=pay(a);
  if(p.s==='pago')return '<span class="tag ok">Pago</span>';
  if(p.s==='atrasado')return '<span class="tag bad">Atrasado há '+(-p.d)+' dia(s)</span>';
  if(p.d===0)return '<span class="tag warn">Vence hoje</span>';
  if(p.d<=3)return '<span class="tag warn">Vence em '+p.d+' dia(s)</span>';
  return '<span class="tag ok">Em dia</span>';
}

/* ---------- agenda e grade ---------- */
function dayItems(date,aid){
  var d=pd(date).getDay(),out=[];
  S.aulas.forEach(function(x){
    if(x.dow!==d||!isPres(al(x.a)))return;
    if(aid&&x.a!==aid)return;
    out.push({a:x.a,h:x.h,k:x.a+'|'+date+'|'+x.h,rep:false});
  });
  S.rep.forEach(function(r){
    if(!r.data||r.data!==date||!isPres(al(r.a)))return;
    if(aid&&r.a!==aid)return;
    out.push({a:r.a,h:r.h,k:'R'+r.id,rep:true,id:r.id});
  });
  return out.sort(function(x,y){return x.h<y.h?-1:x.h>y.h?1:0});
}
function occ(date){
  var d=pd(date).getDay(),o={};
  S.aulas.forEach(function(x){if(x.dow===d&&isPres(al(x.a)))o[String(x.h).slice(0,2)]=1});
  S.rep.forEach(function(r){if(r.data===date&&isPres(al(r.a)))o[String(r.h).slice(0,2)]=1});
  return o;
}
function slotsFor(date){
  var o=occ(date),now=new Date(),isT=date===hoje(),nm=now.getHours()*60+now.getMinutes(),out=[];
  for(var hh=6;hh<=21;hh++){
    if(o[pad(hh)])continue;
    if(isT&&hh*60<=nm)continue;
    out.push(pad(hh)+':00');
  }
  return out;
}
function pickId(aid){
  var pend=S.rep.filter(function(r){return !r.data&&isPres(al(r.a))&&(!aid||r.a===aid)});
  if(ui.sel&&pend.some(function(r){return r.id===ui.sel}))return ui.sel;
  return pend.length===1?pend[0].id:null;
}

/* ---------- escrita no banco (Supabase) ---------- */
function werr(msg){alert(msg||'Não foi possível salvar agora. Verifique a conexão e tente de novo.')}

async function setReg(k,t,rep,a,date){
  var cur=S.reg[k],nt=cur===t?null:t;
  var parts=k.split('|');
  var aulaDate=rep?(S.rep.find(function(r){return r.id===k.slice(1)})||{}).data||date:date;
  var aulaHora=rep?(S.rep.find(function(r){return r.id===k.slice(1)})||{}).h:(parts[2]||'07:00');
  var res=await sb.rpc('registrar_presenca',{
    p_aluno_id:a,
    p_data:aulaDate,
    p_hora:normTime(aulaHora)+':00',
    p_status:nt,
    p_is_reposicao:!!rep
  });
  if(res.error){werr(res.error.message);return}
  await refreshAll();
}

async function togglePay(id){
  var m=mes(),k=id+'|'+m,res;
  if(S.pagos[k]){
    res=await sb.from('pagamentos').delete().eq('aluno_id',id).eq('mes',m);
  }else{
    res=await sb.from('pagamentos').insert({aluno_id:id,mes:m});
  }
  if(res.error){werr(res.error.message);return}
  await refreshAll();
}

async function addAluno(){
  var n=val('f-nome').trim();
  if(!n){alert('Digite o nome do aluno.');return}
  var v=parseFloat(val('f-valor').replace(',','.'))||0;
  var d=Math.min(28,Math.max(1,parseInt(val('f-venc'),10)||10));
  var tipo=val('f-tipo')==='online'?'online':'presencial';
  var tel=val('f-tel').replace(/\D/g,'');
  var ins=await sb.from('alunos').insert({nome:n,valor:v,venc:d,tipo:tipo}).select('id').single();
  if(ins.error||!ins.data){werr(ins.error&&ins.error.message);return}
  var id=ins.data.id;
  if(tel){
    var cRes=await sb.from('contatos').upsert({aluno_id:id,telefone:tel});
    if(cRes.error)werr(cRes.error.message);
  }
  ['f-nome','f-tel','f-valor','f-venc'].forEach(function(x){var e=document.getElementById(x);if(e)e.value=''});
  await refreshAll();
}

async function addAula(aid){
  var h=normTime(val('sh'+aid)||'07:00')+':00';
  var res=await sb.from('aulas').insert({aluno_id:aid,dow:+val('sd'+aid),hora:h});
  if(res.error){werr(res.error.message);return}
  await refreshAll();
}

async function rmAula(id){
  var res=await sb.from('aulas').delete().eq('id',id);
  if(res.error){werr(res.error.message);return}
  await refreshAll();
}

async function rmAluno(id){
  if(!confirm('Excluir este aluno? A grade, as reposições e os pagamentos dele também serão removidos.'))return;
  var res=await sb.from('alunos').delete().eq('id',id);
  if(res.error){werr(res.error.message);return}
  await refreshAll();
}

function selRep(id){ui.sel=ui.sel===id?null:id;snap()}

async function unsched(id){
  var res=await sb.rpc('desmarcar_reposicao',{p_reposicao_id:id});
  if(res.error){werr(res.error.message);return}
  await refreshAll();
}

async function schedSlot(h){
  var id=pickId(ui.scope);
  if(!id){alert('Escolha primeiro a reposição que vai agendar.');return}
  var res=await sb.rpc('agendar_reposicao',{
    p_reposicao_id:id,
    p_data:ui.day,
    p_hora:normTime(h)+':00'
  });
  if(res.error){werr(res.error.message);return}
  ui.sel=null;
  await refreshAll();
}

async function schedExtra(){
  var v=val('rep-extra');
  if(!v){alert('Digite o horário.');return}
  if(ui.day===hoje()){
    var now=new Date(),hm=pad(now.getHours())+':'+pad(now.getMinutes());
    if(v<=hm){alert('Esse horário já passou hoje.');return}
  }
  if(occ(ui.day)[v.slice(0,2)]&&!confirm('Esse horário já tem aula ou reposição. Agendar mesmo assim?'))return;
  await schedSlot(v);
}

/* ---------- ações do personal ---------- */
function cobrar(id){
  var a=al(id),p=pay(a),t=telOf(a);
  if(!t){alert('Cadastre o WhatsApp do aluno em Alunos.');return}
  var msg='Oi, '+firstName(a)+'! Lembrete: a mensalidade de '+brl(a.valor)+' '+(p.s==='atrasado'?'venceu':'vence')+' em '+dmy(p.due)+'. Qualquer dúvida, me chama.';
  window.open(waLink(t,msg),'_blank');
}
function enviarCodigo(id){
  var a=al(id),t=telOf(a),cod=codeOf(a);
  if(!t){alert('Cadastre o WhatsApp deste aluno em Alunos.');return}
  var msg='Oi, '+firstName(a)+'! Seu código de acesso ao Diário do Personal é '+cod+'. Entre na sua conta no app e digite o código na primeira vez.';
  window.open(waLink(t,msg),'_blank');
}

/* ---------- autenticação e aluno ---------- */
async function signInEmail(){
  ui.authErr='';
  var email=val('auth-email').trim();
  var pass=val('auth-pass');
  if(!email||!pass){ui.authErr='Preencha e-mail e senha.';snap();return}
  var res=await sb.auth.signInWithPassword({email:email,password:pass});

async function signUpEmail(){

async function claimCode(){

function copyPix(){
  var done=function(){ui.pixAt=Date.now();snap();setTimeout(snap,2300)};
  var fallback=function(){
    var ta=document.createElement('textarea');
    ta.value=PIX;ta.setAttribute('readonly','');
    ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);
    if(ok)done();else alert('Não foi possível copiar. Chave Pix: '+PIX);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(PIX).then(done,fallback)}
  else fallback();
}
function askNotif(){try{Notification.requestPermission().then(function(){snap()})}catch(e){}}
function stCls(st){return st==='p'?'ok':st==='j'?'warn':'bad'}
function stTxt(st){return st==='p'?'Presente':st==='j'?'Falta avisada':'Faltou'}
function statusHoje(a){
  if(isOnl(a))return{title:'Consultoria online',sub:'Seu acompanhamento não tem horário fixo na agenda. Siga o treino e as orientações passadas pelo seu personal.'};
  var t=hoje(),now=new Date(),nowHM=pad(now.getHours())+':'+pad(now.getMinutes());
  var its=dayItems(t,a.id).filter(function(i){return i.h>nowHM});
  if(its.length){
    var it=its[0],st=S.reg[it.k];
    return{title:'Hoje você tem treino às '+it.h,sub:(it.rep?'Reposição agendada':'Treino fixo')+(st==='j'?' · falta avisada':'')};
  }
  for(var i=1;i<=60;i++){
    var b=new Date();b.setDate(b.getDate()+i);
    var d=iso(b),n=dayItems(d,a.id);
    if(n.length)return{title:'Hoje não há treino agendado',sub:'Próximo treino: '+fd(d)+' às '+n[0].h};
  }
  return{title:'Hoje não há treino agendado',sub:'Nenhum horário fixo encontrado. Fale com o seu personal.'};
}

function itemCard(it,date,aluno){

  return '<div class="card"><div class="row"><div style="display:flex;gap:12px;align-items:center"><span class="hora">'+it.h+'</span><div><b>'+title+'</b>'+(it.rep?' <span class="tag rep">Reposição</span>':'')+'</div></div></div>'+stBtns(it,date,aluno,S.reg[it.k])+'</div>';

function stBtns(it,date,aluno,st){

    if(!fut||it.rep)return st?'<div style="margin-top:8px"><span class="tag '+stCls(st)+'">'+stTxt(st)+'</span></div>':'';
    return '<div class="btns"><button class="b sm j '+(st==='j'?'on':'')+'" onclick="setReg(\''+it.k+'\',\'j\',false,\''+it.a+'\',\''+date+'\')">'+(st==='j'?'Falta avisada · desfazer':'Avisar que vou faltar')+'</button></div>';

function chip(x){return '<span class="chip">'+DOW[x.dow].slice(0,3)+' '+x.h+'<button onclick="rmAula(\''+x.id+'\')" aria-label="Remover horário">×</button></span>'}

/* ---------- reposições (calendário) ---------- */
function calHTML(list){
  var m=ui.mon,t=hoje(),f1=new Date(m.y,m.m,1),days=new Date(m.y,m.m+1,0).getDate(),off=f1.getDay();
  var hasRep={};list.forEach(function(r){hasRep[r.data]=1});
  var h='<div class="date"><button class="b sm" onclick="monthNav(-1)" aria-label="Mês anterior">‹</button><h2>'+MESES[m.m]+' '+m.y+'</h2><button class="b sm" onclick="monthNav(1)" aria-label="Próximo mês">›</button></div>';
  h+='<div class="cal">'+['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(function(x){return '<div class="dw">'+x+'</div>'}).join('');
  for(var i=0;i<off;i++)h+='<span></span>';
  for(var d=1;d<=days;d++){
    var ds=m.y+'-'+pad(m.m+1)+'-'+pad(d);
    var cls=(ds===t?' today':'')+(ds===ui.day?' sel':'');
    h+='<button class="'+cls.trim()+'" '+(ds<t?'disabled ':'')+'onclick="pickDay(\''+ds+'\')" aria-label="'+d+' de '+MESES[m.m]+'">'+d+(hasRep[ds]?'<span class="dot"></span>':'')+'</button>';
  }
  return h+'</div>';
}
function monthNav(d){
  var m=ui.mon,n=new Date(m.y,m.m+d,1),c=new Date();
  if(n<new Date(c.getFullYear(),c.getMonth(),1))return;
  ui.mon={y:n.getFullYear(),m:n.getMonth()};
  snap();
}
function pickDay(ds){ui.day=ds;snap()}
function repArea(aluno){
  var t=hoje();
  if(!ui.mon){var n=new Date();ui.mon={y:n.getFullYear(),m:n.getMonth()}}
  if(!ui.day||ui.day<t)ui.day=t;
  ui.scope=aluno?aluno.id:null;
  var inScope=function(r){return isPres(al(r.a))&&(!aluno||r.a===aluno.id)};
  var pend=S.rep.filter(function(r){return !r.data&&inScope(r)});
  var all=S.rep.filter(function(r){return r.data&&inScope(r)});
  var sch=all.filter(function(r){return r.data>=t}).sort(function(x,y){return x.data<y.data?-1:x.data>y.data?1:(x.h<y.h?-1:x.h>y.h?1:0)});
  if(ui.sel&&!pend.some(function(r){return r.id===ui.sel}))ui.sel=null;
  var pick=pickId(ui.scope),slots=slotsFor(ui.day);
  var h='<div class="card">'+calHTML(all)+'</div>';
  h+='<div class="card"><div class="row"><b>Horários livres · '+fd(ui.day)+'</b></div>';
  if(!pend.length)h+='<p class="mut" style="margin:8px 0 0">Nenhuma reposição pendente para agendar.</p>';
  else if(!pick)h+='<p class="mut" style="margin:8px 0 0">Escolha abaixo a reposição que vai agendar.</p>';
  h+='<div class="slots" style="margin-top:10px">'+(slots.length?slots.map(function(s){return '<button '+(pick?'':'disabled ')+'onclick="schedSlot(\''+s+'\')">'+s+'</button>'}).join(''):'<span class="mut">Sem horários livres neste dia.</span>')+'</div>';
  if(!aluno)h+='<div class="btns" style="margin-top:12px"><input id="rep-extra" type="time" aria-label="Horário extra"><button class="b sm" '+(pick?'':'disabled ')+'onclick="schedExtra()">Agendar em horário extra</button></div>';
  h+='</div>';
  if(pend.length){
    h+='<h2 class="h">A agendar ('+pend.length+')</h2>'+pend.map(function(r){
      var a=al(r.a),on=pick===r.id;
      return '<div class="card"><div class="row"><b>'+(aluno?'Aula perdida':esc(a?a.nome:''))+'</b><span class="mut">'+(r.orig?'Falta em '+fd(r.orig):'')+'</span></div><div class="btns"><button class="b sm '+(on?'p':'')+'" onclick="selRep(\''+r.id+'\')">'+(on?'Selecionada':'Selecionar para agendar')+'</button></div></div>';
    }).join('');
  }
  h+='<h2 class="h">Agendadas ('+sch.length+')</h2>'+(sch.length?sch.map(function(r){
    var a=al(r.a);
    return '<div class="card"><div class="row"><b>'+(aluno?'Minha reposição':esc(a?a.nome:''))+'</b><span class="tag rep">'+fd(r.data)+' às '+r.h+'</span></div><div class="btns"><button class="b sm" onclick="unsched(\''+r.id+'\')">Desmarcar</button></div></div>';
  }).join(''):'<div class="empty">Nada agendado.</div>');
  return h;
}

function render(){
  var app=document.getElementById('app');
  var seg=document.getElementById('seg');
  var nav=document.getElementById('nav');
  if(!UID){
    seg.hidden=true;
    nav.innerHTML='';
    document.body.classList.remove('nav-on');
    document.getElementById('fab').hidden=true;
    document.getElementById('brand').textContent='Diário do Personal';
    app.innerHTML=authView();
    return;
  }
  if(!OWNER)ui.role='a';
  var T=TABS[ui.role];
  if(!T.some(function(x){return x[0]===ui.tab}))ui.tab=T[0][0];
  document.getElementById('brand').textContent=ui.role==='a'?'Danilo Luiz / Personal Trainer':'Diário do Personal';
  if(OWNER){
    seg.hidden=false;
    seg.innerHTML='<button class="'+(ui.role==='p'?'on':'')+'" onclick="role(\'p\')">Personal</button><button class="'+(ui.role==='a'?'on':'')+'" onclick="role(\'a\')">Aluno</button><button onclick="signOutApp()">Sair</button>';
  }else seg.hidden=true;
  app.innerHTML=ui.role==='p'?personalView():studentView();
  var showNav=ui.role==='p'||!!myAluno();
  nav.innerHTML=showNav?T.map(function(x){
    return '<button class="'+(ui.tab===x[0]?'on':'')+'" onclick="tab(\''+x[0]+'\')"><span class="i">'+x[1]+'</span>'+x[2]+'</button>';
  }).join(''):'';
  document.body.classList.toggle('nav-on',showNav);
  document.getElementById('fab').hidden=ui.role!=='a';
}
function snap(){
  var keep={};
  document.querySelectorAll('#app input, #app select').forEach(function(el){if(el.id&&el.type!=='checkbox')keep[el.id]=el.value});
  var y=window.scrollY;
  render();
  Object.keys(keep).forEach(function(id){var el=document.getElementById(id);if(el)el.value=keep[id]});
  window.scrollTo(0,y);
}
function tab(t){ui.tab=t;render();window.scrollTo(0,0)}
function role(r){ui.role=r;ui.tab=TABS[r][0][0];ui.login='';render();window.scrollTo(0,0)}
function go(d){var b=pd(ui.date);b.setDate(b.getDate()+d);ui.date=iso(b);render();window.scrollTo(0,0)}
function goHoje(){ui.date=hoje();render()}

function notify(){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    var t=hoje();
    if(S.lemb===t)return;
    var l=[];
    if(OWNER){
      l=S.alunos.filter(function(a){var p=pay(a);return p.s==='atrasado'||(p.s==='aberto'&&p.d<=3)});
    }else{
      var me=myAluno();
      if(me){var p=pay(me);if(p.s==='atrasado'||(p.s==='aberto'&&p.d<=3))l=[me]}
    }
    if(!l.length)return;
    S.lemb=t;
    try{localStorage.setItem('diario_personal_l',t)}catch(e){}
    new Notification('Diário do Personal',{body:OWNER?l.length+' mensalidade(s) vencendo ou atrasadas.':'Sua mensalidade está próxima do vencimento.'});
  }catch(e){}
}

async function refreshAll(){
  if(!UID)return;
  var admRes=await sb.from('admins').select('user_id').eq('user_id',UID).maybeSingle();
  OWNER=!!(admRes.data&&admRes.data.user_id);
  ui.role=OWNER?(ui.role||'p'):'a';

  var cfgRes=await sb.from('app_config').select('chave,valor').eq('chave','pix_key').maybeSingle();
  if(cfgRes.data&&cfgRes.data.valor)PIX=cfgRes.data.valor;

  var alunosRes=await sb.from('alunos').select('id,nome,tipo,valor,venc');
  S.alunos=(alunosRes.data||[]).map(function(x){
    return {id:x.id,nome:x.nome,tipo:x.tipo,valor:Number(x.valor||0),venc:Number(x.venc||10)};
  });

  var aulasRes=await sb.from('aulas').select('id,aluno_id,dow,hora');
  S.aulas=(aulasRes.data||[]).map(function(x){
    return {id:x.id,a:x.aluno_id,dow:Number(x.dow),h:normTime(x.hora)};
  });

  var repRes=await sb.from('reposicoes').select('id,aluno_id,falta_data,falta_hora,data,hora');
  S.rep=(repRes.data||[]).map(function(r){
    return {id:r.id,a:r.aluno_id,orig:r.falta_data,data:r.data||null,h:r.hora?normTime(r.hora):null};
  });

  var presRes=await sb.from('presencas').select('aluno_id,data,hora,status,is_reposicao');
  S.reg={};
  (presRes.data||[]).forEach(function(p){
    var hh=normTime(p.hora);
    var k=p.aluno_id+'|'+p.data+'|'+hh;
    S.reg[k]=p.status;
    if(p.is_reposicao){
      var matched=S.rep.find(function(r){return r.a===p.aluno_id&&r.data===p.data&&r.h===hh});
      if(matched)S.reg['R'+matched.id]=p.status;
    }
  });

  var pagRes=await sb.from('pagamentos').select('aluno_id,mes');
  S.pagos={};
  (pagRes.data||[]).forEach(function(pg){
    S.pagos[pg.aluno_id+'|'+pg.mes]=pg.aluno_id+'|'+pg.mes;
  });

  var vincRes=await sb.from('vinculos').select('user_id,aluno_id');
  S.vinc={};
  (vincRes.data||[]).forEach(function(v){
    S.vinc[v.user_id]=v.aluno_id;
  });

  S.tel={};
  S.codigos={};
  if(OWNER){
    var contRes=await sb.from('contatos').select('aluno_id,telefone');
    (contRes.data||[]).forEach(function(c){if(c.telefone)S.tel[c.aluno_id]=c.telefone});

    var codRes=await sb.from('codigos_acesso').select('aluno_id,codigo');
    (codRes.data||[]).forEach(function(c){if(c.codigo)S.codigos[c.aluno_id]=c.codigo});
  }

  loaded=true;
  if(!notified){notified=true;notify()}
  snap();
}

(async function boot(){
  ui.date=hoje();
  try{S.lemb=localStorage.getItem('diario_personal_l')||''}catch(e){}

  sb.auth.onAuthStateChange(async function(_event,session){
    SESSION=session;
    UID=session&&session.user?session.user.id:null;
    if(UID){
      await refreshAll();
      if(!pollTimer)pollTimer=setInterval(refreshAll,20000);
    }else{
      OWNER=false;
      if(pollTimer){clearInterval(pollTimer);pollTimer=null}
      render();
    }
  });

  var cur=await sb.auth.getSession();
  SESSION=cur.data&&cur.data.session?cur.data.session:null;
  UID=SESSION&&SESSION.user?SESSION.user.id:null;
  if(UID){
    await refreshAll();
    pollTimer=setInterval(refreshAll,20000);
  }else{
    render();
  }
})();
</script>
