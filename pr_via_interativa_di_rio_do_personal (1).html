<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" id="meta-theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Diário do Personal — Prévia Interativa</title>
<style>
[hidden]{display:none!important}
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --font-disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --bg:#F2F2F7;
  --hdr-bg:rgba(242,242,247,.84);
  --sf:rgba(255,255,255,.78);
  --sf-solid:#FFFFFF;
  --sf-fill:rgba(17,19,24,.048);
  --ink:#111318;
  --mut:#6E6E73;
  --ac:#10B981;
  --ac-dark:#059669;
  --ac-soft:rgba(16,185,129,.12);
  --ac-ink:#065F46;
  --btn-p-bg:#111318;
  --btn-p-ink:#FFFFFF;
  --ln:rgba(60,60,67,.11);
  --glass-edge:rgba(255,255,255,.94);
  --glass-shadow:0 8px 26px rgba(17,19,24,.05),0 1px 2px rgba(17,19,24,.03);
  --ok:#16A34A;
  --ok-bg:#DCFCE7;
  --ok-ink:#15803D;
  --warn:#D97706;
  --warn-bg:#FEF3C7;
  --warn-ink:#B45309;
  --bad:#DC2626;
  --bad-bg:#FEE2E2;
  --bad-ink:#B91C1C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
:root[data-theme="dark"]{
  --bg:#0B0D11;
  --hdr-bg:rgba(11,13,17,.84);
  --sf:rgba(24,27,34,.74);
  --sf-solid:#1C1F26;
  --sf-fill:rgba(255,255,255,.08);
  --ink:#F5F5F7;
  --mut:#98989F;
  --ac:#10B981;
  --ac-dark:#059669;
  --ac-soft:rgba(16,185,129,.18);
  --ac-ink:#34D399;
  --btn-p-bg:#10B981;
  --btn-p-ink:#051B11;
  --ln:rgba(255,255,255,.12);
  --glass-edge:rgba(255,255,255,.13);
  --glass-shadow:0 12px 34px rgba(0,0,0,.46),0 1px 2px rgba(0,0,0,.28);
  --ok:#22C55E;
  --ok-bg:rgba(34,197,94,.16);
  --ok-ink:#4ADE80;
  --warn:#F59E0B;
  --warn-bg:rgba(245,158,11,.18);
  --warn-ink:#FBBF24;
  --bad:#EF4444;
  --bad-bg:rgba(239,68,68,.18);
  --bad-ink:#F87171;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;overflow-x:clip;max-width:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:400 15.5px/1.48 var(--font-sans);
  padding-bottom:calc(108px + env(safe-area-inset-bottom,0px));
  min-height:100vh;
  overflow-x:hidden;
  overflow-x:clip;
  max-width:100%;
  transition:background .25s ease,color .25s ease;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(circle at 14% 6%,rgba(16,185,129,.09) 0%,transparent 42%),
    radial-gradient(circle at 88% 24%,rgba(17,19,24,.04) 0%,transparent 46%),
    radial-gradient(circle at 50% 92%,rgba(16,185,129,.07) 0%,transparent 45%);
}
:root[data-theme="dark"] body::after{
  background:
    radial-gradient(circle at 15% 10%,rgba(16,185,129,.11) 0%,transparent 45%),
    radial-gradient(circle at 85% 25%,rgba(255,255,255,.04) 0%,transparent 50%),
    radial-gradient(circle at 50% 90%,rgba(16,185,129,.08) 0%,transparent 50%);
}

/* Barra discreta de controle da prévia */
.demo-bar{
  background:rgba(17,19,24,.94);
  color:#F5F5F7;
  padding:8px 12px;
  font-size:12.5px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
  border-bottom:1px solid rgba(255,255,255,.12);
}
.demo-pill{
  display:inline-flex;
  background:rgba(255,255,255,.10);
  border-radius:999px;
  padding:2px;
  gap:2px;
}
.demo-pill button{
  border:0;
  background:none;
  color:rgba(255,255,255,.78);
  font:600 12px var(--font-sans);
  padding:4px 10px;
  border-radius:999px;
  cursor:pointer;
}
.demo-pill button.on{
  background:#10B981;
  color:#051B11;
  font-weight:700;
}

h1,h2,h3{font-family:var(--font-disp);font-weight:700;margin:0;letter-spacing:-.025em}

/* Cabeçalho Superior Translúcido Apple Liquid Glass com Logo à esquerda */
header{
  background:var(--hdr-bg);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  backdrop-filter:blur(26px) saturate(180%);
  color:var(--ink);
  position:sticky;
  top:env(safe-area-inset-top,0px);
  z-index:5;
  border-bottom:1px solid var(--ln);
  width:100%;
}
.top{
  max-width:640px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 14px;
  min-height:70px;
}
.hdr-left{
  min-width:0;
  flex:1;
  display:flex;
  align-items:center;
  gap:11px;
}
.hdr-logo{
  flex:0 0 42px;
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.hdr-logo svg{
  width:42px;
  height:42px;
  display:block;
  filter:drop-shadow(0 3px 8px rgba(17,19,24,.08));
}
.hdr-main{
  min-width:0;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:2px;
}
.hdr-sub{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font:700 10.5px/1.15 var(--font-sans);
  text-transform:uppercase;
  letter-spacing:.075em;
  color:var(--mut);
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.hdr-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--ac);
  box-shadow:0 0 0 3px var(--ac-soft);
  flex:0 0 7px;
}
.top h1{
  font-size:clamp(16.5px,4.4vw,21px);
  line-height:1.15;
  text-align:left;
  margin:0;
  font-weight:700;
  letter-spacing:-.025em;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.hdr-right{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:7px;
}
.theme-btn{
  width:36px;
  height:36px;
  border-radius:50%;
  border:1px solid var(--ln);
  background:var(--sf);
  color:var(--mut);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  padding:0;
  box-shadow:0 2px 10px rgba(17,19,24,.04);
  transition:transform .12s ease,color .15s ease,background .15s ease;
}
.theme-btn:hover{color:var(--ink)}
.theme-btn:active{transform:scale(.94)}
.theme-btn svg{width:17px;height:17px;display:block}
.seg{
  flex:0 0 auto;
  display:flex;
  background:var(--sf);
  border:1px solid var(--ln);
  border-radius:999px;
  padding:3px;
  box-shadow:0 2px 10px rgba(17,19,24,.04);
}
.seg button{
  border:0;
  background:none;
  color:var(--ink);
  font:600 13.5px var(--font-sans);
  padding:5px 13px;
  border-radius:999px;
  min-height:30px;
  cursor:pointer;
  transition:background .15s,transform .1s;
}
.seg button:active{transform:scale(.96)}

main{max-width:640px;width:100%;margin:0 auto;padding:16px 14px 0}

/* Cartões Liquid Glass */
.card{
  background:var(--sf);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--glass-edge);
  border-radius:22px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-edge);
  max-width:100%;
  overflow:hidden;
}
.card.hl{
  background:
    radial-gradient(circle at 92% 14%,rgba(16,185,129,.22) 0%,transparent 52%),
    linear-gradient(155deg,#1A1E26 0%,#111318 100%);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 14px 32px rgba(17,19,24,.18),inset 0 1px 0 rgba(255,255,255,.14);
  color:#FFFFFF;
}
.card.hl .lbl{color:#34D399;opacity:1}
.card.hl .mut{color:rgba(255,255,255,.72)}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:14px}
.h{font-size:21px;margin:20px 2px 10px;letter-spacing:-.025em}
.hora{font:700 22px var(--font-disp);font-variant-numeric:tabular-nums;min-width:60px;letter-spacing:-.02em}
.big{font:700 25px/1.15 var(--font-disp);font-variant-numeric:tabular-nums;letter-spacing:-.025em}
.lbl{font:700 11.5px var(--font-sans);text-transform:uppercase;letter-spacing:.07em;opacity:.85}
.greet h2{font-size:28px;margin:4px 2px 14px;line-height:1.12;letter-spacing:-.03em}

.pix{
  background:var(--sf-fill);
  border:1px dashed var(--ln);
  border-radius:14px;
  padding:12px;
  margin-top:12px;
}
.pixkey{font:700 18px var(--font-disp);font-variant-numeric:tabular-nums;letter-spacing:.01em;margin-top:2px;word-break:break-all}
.rules{margin:8px 0 0;padding-left:20px}
.rules li{margin:6px 0}

button,input,select{font:inherit}
.b{
  border:1px solid var(--ln);
  background:var(--sf-fill);
  color:var(--ink);
  border-radius:13px;
  padding:9px 14px;
  font-weight:600;
  font-size:14.5px;
  min-height:42px;
  cursor:pointer;
  transition:transform .12s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease;
}
.b:not(:disabled):active{transform:scale(.97)}
.b:disabled{opacity:.42;cursor:not-allowed}
.b.p{
  background:var(--btn-p-bg);
  border-color:transparent;
  color:var(--btn-p-ink);
  box-shadow:0 6px 16px rgba(17,19,24,.14);
}
.b.ok.on{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 4px 12px rgba(22,163,74,.24)}
.b.bad.on{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 4px 12px rgba(220,38,38,.24)}
.b.j.on{background:var(--warn);border-color:var(--warn);color:#fff;box-shadow:0 4px 12px rgba(217,119,6,.24)}
.b.sm{padding:6px 13px;min-height:35px;font-size:13.5px;border-radius:999px}
.btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}

input,select{
  border:1px solid var(--ln);
  background:var(--sf-fill);
  color:var(--ink);
  border-radius:12px;
  padding:9px 12px;
  min-height:42px;
  font-size:16px;
  min-width:0;
  max-width:100%;
  -webkit-appearance:none;
  appearance:none;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
input:focus,select:focus{
  outline:none;
  border-color:var(--ac);
  box-shadow:0 0 0 3px var(--ac-soft);
}
.f{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;width:100%}
.f input,.f select{width:100%;min-width:0}
.f .w{grid-column:1/-1}

.role-seg{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5px;
  background:var(--sf-fill);border:1px solid var(--ln);
  border-radius:14px;padding:4px;margin-bottom:12px;
}
.role-seg button{
  border:0;background:none;color:var(--mut);
  border-radius:10px;padding:8px 6px;font:600 13.5px/1.2 var(--font-sans);
  cursor:pointer;transition:all .15s ease;
}
.role-seg button.on{
  background:var(--sf-solid);color:var(--ink);font-weight:700;
  box-shadow:0 2px 8px rgba(17,19,24,.08);
}

.tag{
  display:inline-flex;align-items:center;
  font-size:12.5px;font-weight:600;
  padding:3px 10px;border-radius:999px;
  background:var(--sf-fill);color:var(--ink);
  border:1px solid var(--ln);
}
.tag.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok-ink)}
.tag.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad-ink)}
.tag.rep{background:var(--ac-soft);border-color:transparent;color:var(--ac-ink);font-weight:700}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--sf-fill);
  border:1px solid var(--ln);
  border-radius:999px;
  padding:4px 6px 4px 12px;
  margin:4px 4px 0 0;
  font-size:13.5px;font-weight:500;
}
.chip button{border:0;background:none;color:var(--mut);font-size:17px;line-height:1;padding:2px 6px;cursor:pointer;border-radius:50%}

.date{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.date h2{font-size:22px;text-align:center}
.sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:12px}
.sum .card{margin:0}
.sum b{font:700 24px var(--font-disp);font-variant-numeric:tabular-nums;display:block;margin-top:2px}

.cal-wrap{max-width:340px;margin:0 auto}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:6px}
.cal-hdr h2{font-size:18px;text-align:center;letter-spacing:-.01em}
.cal-hdr .b.sm{min-height:30px;padding:2px 11px;font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .dw{font:600 11px var(--font-sans);text-transform:uppercase;color:var(--mut);padding:2px 0 6px}
.cal button{
  position:relative;height:36px;min-height:36px;
  border:1px solid transparent;background:var(--sf-fill);
  border-radius:10px;color:var(--ink);
  font:600 13.5px var(--font-sans);font-variant-numeric:tabular-nums;
  padding:0;cursor:pointer;
  transition:transform .1s,background .15s,border-color .15s;
}
.cal button:not(:disabled):hover{border-color:var(--ink)}
.cal button:not(:disabled):active{transform:scale(.94)}
.cal button:disabled{background:transparent;color:var(--mut);opacity:.30;cursor:not-allowed}
.cal button.today{border-color:var(--ac);font-weight:700}
.cal button.sel{
  background:var(--btn-p-bg);color:var(--btn-p-ink);border-color:transparent;font-weight:700;
  box-shadow:0 4px 12px rgba(17,19,24,.18);
}
.cal .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--ac)}
.cal button.sel .dot{background:var(--btn-p-ink)}

.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slots button{
  border:1px solid var(--ln);background:var(--sf-fill);color:var(--ink);
  border-radius:12px;padding:8px 4px;
  font:700 15px var(--font-disp);font-variant-numeric:tabular-nums;
  min-height:40px;cursor:pointer;transition:all .15s;
}
.slots button:hover{background:var(--btn-p-bg);color:var(--btn-p-ink);border-color:transparent}
.slots button:active{transform:scale(.96)}

.login{max-width:420px;margin:20px auto 0;text-align:center}
.login-brand{display:flex;flex-direction:column;align-items:center;margin-bottom:14px}
.login-brand svg{width:64px;height:64px;filter:drop-shadow(0 8px 18px rgba(17,19,24,.10))}
.login h2{font-size:26px;text-align:center}
.login p{text-align:center}

/* Rodapé Flutuante Liquid Glass (sem logo) */
nav{
  position:fixed;
  left:12px;right:12px;
  bottom:calc(12px + env(safe-area-inset-bottom,0px));
  max-width:560px;
  margin:0 auto;
  background:var(--sf);
  -webkit-backdrop-filter:blur(28px) saturate(200%);
  backdrop-filter:blur(28px) saturate(200%);
  border:1px solid var(--glass-edge);
  border-radius:999px;
  box-shadow:0 12px 34px rgba(17,19,24,.12),inset 0 1px 0 var(--glass-edge);
  display:flex;
  align-items:center;
  padding:6px;
  gap:4px;
  min-height:70px;
  z-index:6;
}
nav:empty{display:none}
nav button.tab-btn{
  flex:1;
  min-width:0;
  border:0;
  background:none;
  color:var(--mut);
  font:600 12px/1.15 var(--font-sans);
  letter-spacing:-.01em;
  padding:7px 4px;
  min-height:58px;
  border-radius:999px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  cursor:pointer;
  transition:background .2s ease,color .2s ease,transform .12s ease,box-shadow .2s ease;
}
@media(min-width:390px){
  nav button.tab-btn{font-size:12.5px}
}
nav button.tab-btn:active{transform:scale(.95)}
nav button.tab-btn .i{font-size:20px;line-height:1}
nav button.tab-btn .t{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button.tab-btn.on{
  background:var(--sf-solid);
  color:var(--ink);
  font-weight:700;
  box-shadow:0 4px 14px rgba(17,19,24,.09),inset 0 1px 0 rgba(255,255,255,.9);
}
:root[data-theme="dark"] nav button.tab-btn.on{
  background:var(--ac);
  color:#051B11;
  box-shadow:0 4px 14px rgba(16,185,129,.28);
}

.fab{
  position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(145deg,#2EE673,#16A34A);
  border:1px solid rgba(255,255,255,.45);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 24px rgba(22,163,74,.30),inset 0 1px 0 rgba(255,255,255,.55);
  z-index:7;text-decoration:none;transition:transform .15s ease;
}
.fab:active{transform:scale(.94)}
body.nav-on .fab{bottom:calc(94px + env(safe-area-inset-bottom,0px))}
.fab svg{width:28px;height:28px;fill:#fff}

.bell-fab{
  position:fixed;right:16px;bottom:calc(94px + env(safe-area-inset-bottom,0px));
  width:54px;height:54px;border-radius:50%;
  background:rgba(17,19,24,.90);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  backdrop-filter:blur(20px) saturate(180%);
  color:#FFFFFF;
  border:1.5px solid rgba(16,185,129,.70);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px rgba(17,19,24,.24),inset 0 1px 0 rgba(255,255,255,.20);
  z-index:7;cursor:pointer;font-size:21px;transition:transform .15s ease;
}
.bell-fab:active{transform:scale(.94)}
.bell-badge{
  position:absolute;top:-4px;right:-4px;
  background:var(--bad);color:#fff;
  font:700 11.5px/1 var(--font-sans);
  padding:3px 6px;border-radius:999px;min-width:20px;text-align:center;
  box-shadow:0 2px 6px rgba(0,0,0,.28);
}

.notif-pop{
  position:fixed;right:16px;bottom:calc(158px + env(safe-area-inset-bottom,0px));
  width:min(340px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;
  background:var(--sf);
  -webkit-backdrop-filter:blur(30px) saturate(200%);
  backdrop-filter:blur(30px) saturate(200%);
  border:1px solid var(--glass-edge);
  border-radius:22px;padding:14px;
  box-shadow:0 18px 42px rgba(17,19,24,.20),inset 0 1px 0 var(--glass-edge);
  z-index:8;
}
.notif-item{padding:10px;border-bottom:1px solid var(--ln);font-size:13.5px;border-radius:12px;cursor:pointer;transition:background .15s}
.notif-item:hover{background:var(--sf-fill)}
.notif-item:last-child{border-bottom:0}
.notif-item.unread{background:var(--ac-soft)}
.notif-item.unread .n-title,.notif-item.unread .n-msg{font-weight:700;color:var(--ink)}
.notif-item.read .n-title,.notif-item.read .n-msg{font-weight:400;color:var(--mut)}
.n-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:6px;vertical-align:middle}

.b.wa{border-color:rgba(22,163,74,.28);color:#15803D;background:rgba(22,163,74,.10)}
:root[data-theme="dark"] .b.wa{color:#4ADE80;background:rgba(34,197,94,.16)}

.wk-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px}
.wk-day{
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:8px 2px;border-radius:12px;
  border:1px solid var(--ln);background:var(--sf-fill);

      (a.pago?'':'<button type="button" class="b sm" onclick="showToast(\'Envia lembrete automático de Pix no WhatsApp!\')">Cobrar no WhatsApp</button>')+
      '</div></div>';
  });
  return h;
}

function renderLogin(){
  var isReg=st.authMode==='signup';
  var isReset=st.authMode==='reset';
  var isPers=st.authRole==='personal';
  var heroLogo='<div class="login-brand">'+logoSvg('auth')+'</div>';

  if(isReset){
    return '<div class="login"><div class="card">'+heroLogo+'<h2>Esqueci / Trocar senha</h2>'+
      '<p class="mut" style="margin:6px 0 14px">Informe seu e-mail, o código de 6 dígitos do seu cadastro e a nova senha.</p>'+
      '<div class="f">'+
      '<input class="w" type="email" placeholder="Seu e-mail cadastrado">'+
      '<input class="w" inputmode="numeric" maxlength="6" placeholder="Código de 6 dígitos">'+
      '<input class="w" type="password" placeholder="Nova senha (mín. 6 caracteres)">'+
      '</div>'+
      '<div class="btns" style="justify-content:center;margin-top:14px"><button type="button" class="b p" onclick="showToast(\'Senha redefinida com sucesso!\')" style="width:100%">Redefinir senha</button></div>'+
      '<div class="btns" style="justify-content:center"><button type="button" class="b sm" onclick="st.authMode=\'login\';render()">Voltar para o login</button></div></div></div>';
  }

  if(isReg){
    return '<div class="login"><div class="card">'+heroLogo+'<h2>Criar conta</h2>'+
      '<p class="mut" style="margin:6px 0 12px">Escolha como você vai usar o Diário do Personal:</p>'+
      '<div class="role-seg"><button type="button" class="'+(isPers?'':'on')+'" onclick="st.authRole=\'aluno\';render()">Sou Aluno</button><button type="button" class="'+(isPers?'on':'')+'" onclick="st.authRole=\'personal\';render()">Sou Personal (Piloto 30d)</button></div>'+
      '<div class="f">'+(isPers?'<input class="w" placeholder="Seu Nome Profissional (ex: Lucas Silva / Personal)"><input placeholder="WhatsApp com DDD"><input placeholder="Sua Chave Pix">':'')+
      '<input class="w" type="email" placeholder="Seu e-mail"><input class="w" type="password" placeholder="Crie uma senha (mín. 6 caracteres)"></div>'+
      '<div class="btns" style="justify-content:center;margin-top:14px"><button type="button" class="b p" onclick="setDemoMode(\''+(isPers?'p':'a')+'\')" style="width:100%">'+(isPers?'Criar conta de Personal':'Cadastrar como Aluno')+'</button></div>'+
      '<div class="btns" style="justify-content:center"><button type="button" class="b sm" onclick="st.authMode=\'login\';render()">Já tenho conta · Entrar</button></div></div></div>';
  }

  return '<div class="login"><div class="card">'+heroLogo+'<h2>Entrar no Diário</h2>'+
    '<p class="mut" style="margin:6px 0 14px">Sua rotina de treinos, no ritmo certo.</p>'+
    '<div class="f"><input class="w" type="email" value="danilo@diariodopersonal.com.br"><input class="w" type="password" value="••••••••"></div>'+
    '<div class="btns" style="justify-content:center;margin-top:14px"><button type="button" class="b p" onclick="setDemoMode(\'p\')" style="width:100%">Entrar</button></div>'+
    '<div class="btns" style="justify-content:center"><button type="button" class="b sm" onclick="st.authMode=\'signup\';render()">Primeiro acesso · Criar conta</button></div>'+
    '<div class="btns" style="justify-content:center;margin-top:4px"><button type="button" class="b sm" style="border-color:transparent;background:none;color:var(--mut);font-size:13px" onclick="st.authMode=\'reset\';render()">Esqueci a senha / Trocar senha</button></div></div></div>';
}

function render(){
  var app=document.getElementById('app');
  var nav=document.getElementById('nav');
  var seg=document.getElementById('seg');
  var fab=document.getElementById('fab');
  var subWrap=document.getElementById('hdr-sub-wrap');
  var subEl=document.getElementById('hdr-sub');
  var brandEl=document.getElementById('brand');
  var hdrLogo=document.getElementById('hdr-logo');
  if(hdrLogo&&!hdrLogo.innerHTML)hdrLogo.innerHTML=logoSvg('hdr');

  if(st.mode==='login'){
    seg.hidden=true;
    nav.innerHTML='';
    fab.hidden=true;
    document.body.classList.remove('nav-on');
    if(subWrap)subWrap.hidden=true;
    brandEl.textContent='Diário do Personal';
    app.innerHTML=renderLogin();
    renderBell();
    return;
  }

  document.body.classList.add('nav-on');
  seg.hidden=false;
  var T=TABS[st.mode];
  if(!T.some(function(x){return x[0]===st.tab}))st.tab=T[0][0];

  if(st.mode==='p'){
    if(subWrap)subWrap.hidden=false;
    subEl.textContent='GESTÃO & PERFORMANCE';
    brandEl.textContent='Diário do Personal';
    fab.hidden=true;
    if(st.tab==='alunos')app.innerHTML=renderPersonalAlunos();
    else if(st.tab==='rep')app.innerHTML=renderRep(false);
    else if(st.tab==='pag')app.innerHTML=renderPersonalPag();
    else app.innerHTML=renderPersonalAgenda();
  }else{
    if(subWrap)subWrap.hidden=false;
    subEl.textContent='DIÁRIO DO PERSONAL';
    brandEl.textContent=DEMO.perfil.nome_profissional;
    fab.hidden=false;
    if(st.tab==='aulas')app.innerHTML=renderAlunoAulas();
    else if(st.tab==='rep')app.innerHTML=renderRep(true);
    else app.innerHTML=renderAlunoInicio();
  }

  nav.innerHTML=T.map(function(x){
    return '<button type="button" class="tab-btn'+(st.tab===x[0]?' on':'')+'" onclick="setTab(\''+x[0]+'\')"><span class="i">'+x[1]+'</span><span class="t">'+x[2]+'</span></button>';
  }).join('');

  renderBell();
}

render();
</script>

</html>
