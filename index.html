<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" id="meta-theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Diário Personal">

<title>Diário do Personal</title>
<style>
[hidden]{display:none!important}
:root{
  --font-sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --font-disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --bg:#F2F2F7;
  --hdr-bg:rgba(242,242,247,.92);
  --sf:rgba(255,255,255,.78);
  --sf-solid:#FFFFFF;
  --sf-fill:rgba(17,19,24,.048);
  --ink:#111318;
  --mut:#6E6E73;
  --ac:#10B981;
  --ac-dark:#059669;
  --ac-soft:rgba(16,185,129,.12);
  --ac-ink:#065F46;
  --btn-p-bg:#111318;
  --btn-p-ink:#FFFFFF;
  --ln:rgba(60,60,67,.11);
  --glass-edge:rgba(255,255,255,.94);
  --glass-shadow:0 8px 26px rgba(17,19,24,.05),0 1px 2px rgba(17,19,24,.03);
  --ok:#16A34A;
  --ok-bg:#DCFCE7;
  --ok-ink:#15803D;
  --warn:#D97706;
  --warn-bg:#FEF3C7;
  --warn-ink:#B45309;
  --bad:#DC2626;
  --bad-bg:#FEE2E2;
  --bad-ink:#B91C1C;
  box-sizing:border-box;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0D11;
    --hdr-bg:rgba(11,13,17,.90);
    --sf:rgba(24,27,34,.74);
    --sf-solid:#1C1F26;
    --sf-fill:rgba(255,255,255,.08);
    --ink:#F5F5F7;
    --mut:#98989F;
    --ac:#10B981;
    --ac-dark:#059669;
    --ac-soft:rgba(16,185,129,.18);
    --ac-ink:#34D399;
    --btn-p-bg:#10B981;
    --btn-p-ink:#051B11;
    --ln:rgba(255,255,255,.12);
    --glass-edge:rgba(255,255,255,.13);
    --glass-shadow:0 12px 34px rgba(0,0,0,.46),0 1px 2px rgba(0,0,0,.28);
    --ok:#22C55E;
    --ok-bg:rgba(34,197,94,.16);
    --ok-ink:#4ADE80;
    --warn:#F59E0B;
    --warn-bg:rgba(245,158,11,.18);
    --warn-ink:#FBBF24;
    --bad:#EF4444;
    --bad-bg:rgba(239,68,68,.18);
    --bad-ink:#F87171;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0D11;
  --hdr-bg:rgba(11,13,17,.90);
  --sf:rgba(24,27,34,.74);
  --sf-solid:#1C1F26;
  --sf-fill:rgba(255,255,255,.08);
  --ink:#F5F5F7;
  --mut:#98989F;
  --ac:#10B981;
  --ac-dark:#059669;
  --ac-soft:rgba(16,185,129,.18);
  --ac-ink:#34D399;
  --btn-p-bg:#10B981;
  --btn-p-ink:#051B11;
  --ln:rgba(255,255,255,.12);
  --glass-edge:rgba(255,255,255,.13);
  --glass-shadow:0 12px 34px rgba(0,0,0,.46),0 1px 2px rgba(0,0,0,.28);
  --ok:#22C55E;
  --ok-bg:rgba(34,197,94,.16);
  --ok-ink:#4ADE80;
  --warn:#F59E0B;
  --warn-bg:rgba(245,158,11,.18);
  --warn-ink:#FBBF24;
  --bad:#EF4444;
  --bad-bg:rgba(239,68,68,.18);
  --bad-ink:#F87171;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-x:hidden;overflow-x:clip;max-width:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font:400 15.5px/1.48 var(--font-sans);
  padding-bottom:calc(108px + env(safe-area-inset-bottom,0px));
  min-height:100vh;
  overflow-x:hidden;
  overflow-x:clip;
  max-width:100%;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(circle at 14% 6%,rgba(16,185,129,.09) 0%,transparent 42%),
    radial-gradient(circle at 88% 24%,rgba(17,19,24,.04) 0%,transparent 46%),
    radial-gradient(circle at 50% 92%,rgba(16,185,129,.07) 0%,transparent 45%);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) body::after{
    background:
      radial-gradient(circle at 15% 10%,rgba(16,185,129,.11) 0%,transparent 45%),
      radial-gradient(circle at 85% 25%,rgba(255,255,255,.04) 0%,transparent 50%),
      radial-gradient(circle at 50% 90%,rgba(16,185,129,.08) 0%,transparent 50%);
  }
}
:root[data-theme="dark"] body::after{
  background:
    radial-gradient(circle at 15% 10%,rgba(16,185,129,.11) 0%,transparent 45%),
    radial-gradient(circle at 85% 25%,rgba(255,255,255,.04) 0%,transparent 50%),
    radial-gradient(circle at 50% 90%,rgba(16,185,129,.08) 0%,transparent 50%);
}

h1,h2,h3{font-family:var(--font-disp);font-weight:700;margin:0;letter-spacing:-.025em}

/* Cabeçalho Superior Translúcido Apple Liquid Glass com espaçamento seguro abaixo da status bar */
header{
  background:var(--hdr-bg);
  -webkit-backdrop-filter:blur(26px) saturate(180%);
  backdrop-filter:blur(26px) saturate(180%);
  color:var(--ink);
  position:sticky;
  top:0;
  padding-top:calc(env(safe-area-inset-top,0px) + 8px);
  z-index:5;
  border-bottom:1px solid var(--ln);
  width:100%;
}
.top{
  max-width:640px;
  margin:0 auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:10px 14px 12px;
  min-height:64px;
}
.hdr-left{
  min-width:0;
  flex:1;
  display:flex;
  align-items:center;
  gap:11px;
}
.hdr-logo{
  flex:0 0 42px;
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.hdr-logo svg{
  width:42px;
  height:42px;
  display:block;
  filter:drop-shadow(0 3px 8px rgba(17,19,24,.08));
}
.hdr-main{
  min-width:0;
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:2px;
}
.hdr-sub{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font:700 10.5px/1.15 var(--font-sans);
  text-transform:uppercase;
  letter-spacing:.075em;
  color:var(--mut);
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.hdr-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--ac);
  box-shadow:0 0 0 3px var(--ac-soft);
  flex:0 0 7px;
}
.top h1{
  font-size:clamp(16.5px,4.4vw,21px);
  line-height:1.15;
  text-align:left;
  margin:0;
  font-weight:700;
  letter-spacing:-.025em;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.hdr-right{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:7px;
}
.theme-btn{
  width:36px;
  height:36px;
  border-radius:50%;
  border:1px solid var(--ln);
  background:var(--sf);
  color:var(--mut);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  padding:0;
  box-shadow:0 2px 10px rgba(17,19,24,.04);
  transition:transform .12s ease,color .15s ease,background .15s ease;
}
.theme-btn:hover{color:var(--ink)}
.theme-btn:active{transform:scale(.94)}
.theme-btn svg{width:17px;height:17px;display:block}
.seg{
  flex:0 0 auto;
  display:flex;
  background:var(--sf);
  border:1px solid var(--ln);
  border-radius:999px;
  padding:3px;
  box-shadow:0 2px 10px rgba(17,19,24,.04);
}
.seg button{
  border:0;
  background:none;
  color:var(--ink);
  font:600 13.5px var(--font-sans);
  padding:5px 13px;
  border-radius:999px;
  min-height:30px;
  cursor:pointer;
  transition:background .15s,transform .1s;
}
.seg button:active{transform:scale(.96)}

main{max-width:640px;width:100%;margin:0 auto;padding:16px 14px 0}

/* Cartões Liquid Glass */
.card{
  background:var(--sf);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--glass-edge);
  border-radius:22px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--glass-shadow),inset 0 1px 0 var(--glass-edge);
  max-width:100%;
  overflow:hidden;
}
/* Hero Card Obsidian Precision */
.card.hl{
  background:
    radial-gradient(circle at 92% 14%,rgba(16,185,129,.22) 0%,transparent 52%),
    linear-gradient(155deg,#1A1E26 0%,#111318 100%);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 14px 32px rgba(17,19,24,.18),inset 0 1px 0 rgba(255,255,255,.14);
  color:#FFFFFF;
}
.card.hl .lbl{color:#34D399;opacity:1}
.card.hl .mut{color:rgba(255,255,255,.72)}

.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mut{color:var(--mut);font-size:14px}
.h{font-size:21px;margin:20px 2px 10px;letter-spacing:-.025em}
.hora{font:700 22px var(--font-disp);font-variant-numeric:tabular-nums;min-width:60px;letter-spacing:-.02em}
.big{font:700 25px/1.15 var(--font-disp);font-variant-numeric:tabular-nums;letter-spacing:-.025em}
.lbl{font:700 11.5px var(--font-sans);text-transform:uppercase;letter-spacing:.07em;opacity:.85}
.greet h2{font-size:28px;margin:4px 2px 14px;line-height:1.12;letter-spacing:-.03em}
.quote p{margin:6px 0 0;font:italic 500 17px/1.35 var(--font-sans)}

.pix{
  background:var(--sf-fill);
  border:1px dashed var(--ln);
  border-radius:14px;
  padding:12px;
  margin-top:12px;
}
.pixkey{font:700 20px var(--font-disp);font-variant-numeric:tabular-nums;letter-spacing:.02em;margin-top:2px;word-break:break-all}
.rules{margin:8px 0 0;padding-left:20px}
.rules li{margin:6px 0}

button,input,select{font:inherit}
.b{
  border:1px solid var(--ln);
  background:var(--sf-fill);
  color:var(--ink);
  border-radius:13px;
  padding:9px 14px;
  font-weight:600;
  font-size:14.5px;
  min-height:42px;
  cursor:pointer;
  transition:transform .12s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease;
}
.b:not(:disabled):active{transform:scale(.97)}
.b:disabled{opacity:.42;cursor:not-allowed}
.b.p{
  background:var(--btn-p-bg);
  border-color:transparent;
  color:var(--btn-p-ink);
  box-shadow:0 6px 16px rgba(17,19,24,.14);
}
.b.ok.on{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 4px 12px rgba(22,163,74,.24)}
.b.bad.on{background:var(--bad);border-color:var(--bad);color:#fff;box-shadow:0 4px 12px rgba(220,38,38,.24)}
.b.j.on{background:var(--warn);border-color:var(--warn);color:#fff;box-shadow:0 4px 12px rgba(217,119,6,.24)}
.b.sm{padding:6px 13px;min-height:35px;font-size:13.5px;border-radius:999px}
.btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px;align-items:center}

input,select{
  border:1px solid var(--ln);
  background:var(--sf-fill);
  color:var(--ink);
  border-radius:12px;
  padding:9px 12px;
  min-height:42px;
  font-size:16px;
  min-width:0;
  max-width:100%;
  -webkit-appearance:none;
  appearance:none;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
input:focus,select:focus{
  outline:none;
  border-color:var(--ac);
  box-shadow:0 0 0 3px var(--ac-soft);
}
.f{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;width:100%}
.f input,.f select{width:100%;min-width:0}
.f .w{grid-column:1/-1}

.role-seg{
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:5px;
  background:var(--sf-fill);border:1px solid var(--ln);
  border-radius:14px;padding:4px;margin-bottom:12px;
}
.role-seg button{
  border:0;background:none;color:var(--mut);
  border-radius:10px;padding:8px 6px;font:600 13.5px/1.2 var(--font-sans);
  cursor:pointer;transition:all .15s ease;
}
.role-seg button.on{
  background:var(--sf-solid);color:var(--ink);font-weight:700;
  box-shadow:0 2px 8px rgba(17,19,24,.08);
}

.tag{
  display:inline-flex;align-items:center;
  font-size:12.5px;font-weight:600;
  padding:3px 10px;border-radius:999px;
  background:var(--sf-fill);color:var(--ink);
  border:1px solid var(--ln);
}
.tag.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok-ink)}
.tag.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad-ink)}
.tag.rep{background:var(--ac-soft);border-color:transparent;color:var(--ac-ink);font-weight:700}
.tag.warn{background:var(--warn-bg);border-color:transparent;color:var(--warn-ink)}

.alert{
  background:var(--warn-bg);
  color:var(--warn-ink);
  border:1px solid rgba(217,119,6,.24);
  border-radius:16px;
  padding:12px 14px;
  margin-bottom:12px;
  font-weight:600;
  font-size:14px;
}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--sf-fill);
  border:1px solid var(--ln);
  border-radius:999px;
  padding:4px 6px 4px 12px;
  margin:4px 4px 0 0;
  font-size:13.5px;font-weight:500;
}
.chip button{border:0;background:none;color:var(--mut);font-size:17px;line-height:1;padding:2px 6px;cursor:pointer;border-radius:50%}

.date{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.date h2{font-size:22px;text-align:center}
.sum{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:12px}
.sum .card{margin:0}
.sum b{font:700 24px var(--font-disp);font-variant-numeric:tabular-nums;display:block;margin-top:2px}
.empty{text-align:center;color:var(--mut);padding:28px 12px}

.cal-wrap{max-width:340px;margin:0 auto}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:6px}
.cal-hdr h2{font-size:18px;text-align:center;letter-spacing:-.01em}
.cal-hdr .b.sm{min-height:30px;padding:2px 11px;font-size:15px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .dw{font:600 11px var(--font-sans);text-transform:uppercase;color:var(--mut);padding:2px 0 6px}
.cal button{
  position:relative;height:36px;min-height:36px;
  border:1px solid transparent;background:var(--sf-fill);
  border-radius:10px;color:var(--ink);
  font:600 13.5px var(--font-sans);font-variant-numeric:tabular-nums;
  padding:0;cursor:pointer;
  transition:transform .1s,background .15s,border-color .15s;
}
.cal button:not(:disabled):hover{border-color:var(--ink)}
.cal button:not(:disabled):active{transform:scale(.94)}
.cal button:disabled{background:transparent;color:var(--mut);opacity:.30;cursor:not-allowed}
.cal button.today{border-color:var(--ac);font-weight:700}
.cal button.sel{
  background:var(--btn-p-bg);color:var(--btn-p-ink);border-color:transparent;font-weight:700;
  box-shadow:0 4px 12px rgba(17,19,24,.18);
}
.cal .dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--ac)}
.cal button.sel .dot{background:var(--btn-p-ink)}

.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slots button{
  border:1px solid var(--ln);background:var(--sf-fill);color:var(--ink);
  border-radius:12px;padding:8px 4px;
  font:700 15px var(--font-disp);font-variant-numeric:tabular-nums;
  min-height:40px;cursor:pointer;transition:all .15s;
}
.slots button:not(:disabled):hover{background:var(--btn-p-bg);color:var(--btn-p-ink);border-color:transparent}
.slots button:not(:disabled):active{transform:scale(.96)}

.login{max-width:420px;margin:20px auto 0;text-align:center}
.login-brand{display:flex;flex-direction:column;align-items:center;margin-bottom:14px}
.login-brand svg{width:64px;height:64px;filter:drop-shadow(0 8px 18px rgba(17,19,24,.10))}
.login h2{font-size:26px;text-align:center}
.login p{text-align:center}
.login input.code-inp{width:100%;text-align:center;font:700 26px var(--font-disp);letter-spacing:8px}
.login .f input{width:100%;text-align:left;font:400 16px/1.4 var(--font-sans);letter-spacing:normal}
.err{color:var(--bad-ink);font-weight:600;font-size:13.5px;min-height:22px;margin-top:8px;text-align:center}

.aluno-foot{text-align:center;margin:22px 0 10px}
.aluno-foot button{border:0;background:none;color:var(--mut);font:500 13px/1.2 var(--font-sans);text-decoration:underline;cursor:pointer;padding:6px 10px;opacity:.9}
.aluno-foot button:hover{opacity:1;color:var(--ink)}

/* Rodapé Flutuante Liquid Glass (sem logo) */
nav{
  position:fixed;
  left:12px;right:12px;
  bottom:calc(12px + env(safe-area-inset-bottom,0px));
  max-width:560px;
  margin:0 auto;
  background:var(--sf);
  -webkit-backdrop-filter:blur(28px) saturate(200%);
  backdrop-filter:blur(28px) saturate(200%);
  border:1px solid var(--glass-edge);
  border-radius:999px;
  box-shadow:0 12px 34px rgba(17,19,24,.12),inset 0 1px 0 var(--glass-edge);
  display:flex;
  align-items:center;
  padding:6px;
  gap:4px;
  min-height:70px;
  z-index:6;
}
nav:empty{display:none}
nav button.tab-btn{
  flex:1;
  min-width:0;
  border:0;
  background:none;
  color:var(--mut);
  font:600 12px/1.15 var(--font-sans);
  letter-spacing:-.01em;
  padding:7px 4px;
  min-height:58px;
  border-radius:999px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  cursor:pointer;
  transition:background .2s ease,color .2s ease,transform .12s ease,box-shadow .2s ease;
}
@media(min-width:390px){
  nav button.tab-btn{font-size:12.5px}
}
nav button.tab-btn:active{transform:scale(.95)}
nav button.tab-btn .i{font-size:20px;line-height:1}
nav button.tab-btn .t{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav button.tab-btn.on{
  background:var(--sf-solid);
  color:var(--ink);
  font-weight:700;
  box-shadow:0 4px 14px rgba(17,19,24,.09),inset 0 1px 0 rgba(255,255,255,.9);
}
:root[data-theme="dark"] nav button.tab-btn.on{
  background:var(--ac);
  color:#051B11;
  box-shadow:0 4px 14px rgba(16,185,129,.28);
}
@media(prefers-color-scheme:dark){

  return !!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function applyTheme(t){
  if(t==='dark'||t==='light'){

  }
}

}

function pad(n){return(n<10?'0':'')+n}

  return out.sort(function(x,y){return x.h<y.h?-1:x.h>y.h?1:0});
}
function occ(date){
  var d=pd(date).getDay(),o={};
  if(!OWNER){
    var lib={};
    (S.occPersonal||[]).forEach(function(row){
      if(row.kind==='liberada'&&row.data===date)lib[normTime(row.hora)]=1;
    });
    (S.occPersonal||[]).forEach(function(row){
      var hh=normTime(row.hora);
      if(row.kind==='fixa'&&Number(row.dow)===d){
        if(lib[hh])return;
        o[hh]=1;o[hh.slice(0,2)]=1;
      }else if(row.kind==='rep'&&row.data===date){
        o[hh]=1;o[hh.slice(0,2)]=1;
      }
    });
    return o;
  }
  S.aulas.forEach(function(x){
    if(x.dow!==d||!isPres(al(x.a)))return;
    var k=x.a+'|'+date+'|'+x.h;
    if(S.reg[k]==='j')return;
    o[x.h]=1;
    o[String(x.h).slice(0,2)]=1;
  });
  S.rep.forEach(function(r){
    if(r.data!==date||!isPres(al(r.a)))return;
    if(S.reg['R'+r.id]==='j')return;
    o[r.h]=1;
    o[String(r.h).slice(0,2)]=1;
  });
  return o;
}

function slotsFor(date,minHours){
  var d=pd(date).getDay(),o=occ(date),now=new Date(),leadMs=(minHours||0)*36e5;
  var pool={};
  var manual=(S.repSlots&&Array.isArray(S.repSlots[d]))?S.repSlots[d]:[];
  manual.forEach(function(h){pool[normTime(h)]=1});
  if(!OWNER){
    (S.occPersonal||[]).forEach(function(row){
      if(row.kind==='liberada'&&row.data===date)pool[normTime(row.hora)]=1;
    });
  }else{
    S.aulas.forEach(function(x){
      if(x.dow!==d||!isPres(al(x.a)))return;
      var k=x.a+'|'+date+'|'+x.h;
      if(S.reg[k]==='j')pool[normTime(x.h)]=1;
    });
  }
  return Object.keys(pool).sort().filter(function(hm){
    if(o[hm]||o[hm.slice(0,2)])return false;
    var slotDt=new Date(date+'T'+hm+':00');
    if(slotDt.getTime()-now.getTime()<leadMs)return false;
    return true;
  });
}
function pickId(aid){
  var pend=S.rep.filter(function(r){
    if(r.data||!isPres(al(r.a)))return false;
    if(aid&&(r.a!==aid||!isRepValidaAluno(r)))return false;
    return true;
  });
  if(ui.sel&&pend.some(function(r){return r.id===ui.sel}))return ui.sel;
  return pend.length===1?pend[0].id:null;
}

async function schedSlot(h){
  var id=pickId(ui.scope);
  if(!id){showMsg('Escolha primeiro a reposição que vai agendar.');return}
  var targetRep=S.rep.find(function(r){return r.id===id});
  if(ui.scope){
    var targetMonth=repMesRef(targetRep);
    if(targetMonth<mes()){
      showMsg('Este crédito pertence a um mês anterior e expirou (não acumula para o mês seguinte).');
      return;
    }
    if(ui.day<hoje()){
      showMsg('Não é possível agendar reposição em data passada.');
      return;
    }
    if(ui.day.slice(0,7)!==targetMonth){
      showMsg('A reposição só pode ser agendada dentro do próprio mês (não acumula para o mês seguinte).');
      return;
    }
    var slotDt=new Date(ui.day+'T'+normTime(h)+':00');
    if(slotDt.getTime()-Date.now()<12*36e5){
      showMsg('O agendamento de reposição exige no mínimo 12 horas de antecedência.');
      return;
    }
  }
  var res=await sb.rpc('agendar_reposicao',{
    p_reposicao_id:id,
    p_data:ui.day,
    p_hora:normTime(h)+':00'
  });
  if(res.error){werr(res.error.message);return}
  if(targetRep&&(!OWNER||ui.role==='a')){
    await pushAlunoNotif(targetRep.a,'Agendou reposição para '+fd(ui.day)+' às '+normTime(h)+'.');
  }
  ui.sel=null;
  await refreshAll();
}

async function schedExtra(){

    if(v<=hm){showMsg('Esse horário já passou hoje.');return}
  }
  if(occ(ui.day)[v.slice(0,2)]){
    showMsg('Esse horário já tem aula ou reposição. Agendar mesmo assim?',function(){schedSlot(v)});
    return;
  }
  await schedSlot(v);
}

  var pix=activePix();
  if(!pix){showMsg('Chave Pix ainda não configurada pelo seu personal.');return}
  var done=function(){ui.pixAt=Date.now();snap();setTimeout(snap,2300)};
  var fallback=function(){
    var ta=document.createElement('textarea');
    ta.value=pix;ta.setAttribute('readonly','');
    ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);
    if(ok)done();else showMsg('Não foi possível copiar. Chave Pix: '+pix);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(pix).then(done,fallback)}
  else fallback();
}

function stCls(st){return st==='p'?'ok':st==='j'?'warn':'bad'}
function stTxt(st){return st==='p'?'Presente':st==='j'?'Falta avisada':'Faltou'}
function statusHoje(a){
  if(isOnl(a))return{title:'Consultoria online',sub:'Seu acompanhamento não tem horário fixo na agenda. Siga o treino e as orientações passadas pelo seu personal.'};
  var t=hoje(),now=new Date(),nowHM=pad(now.getHours())+':'+pad(now.getMinutes());
  var its=dayItems(t,a.id).filter(function(i){return i.h>nowHM});
  if(its.length){
    var it=its[0],st=S.reg[it.k];
    return{title:'Hoje você tem treino às '+it.h,sub:(it.rep?'Reposição agendada':'Treino fixo')+(st==='j'?' · falta avisada':'')};
  }
  for(var i=1;i<=60;i++){
    var b=new Date();b.setDate(b.getDate()+i);
    var d=iso(b),n=dayItems(d,a.id);
    if(n.length)return{title:'Hoje não há treino agendado',sub:'Próximo treino: '+fd(d)+' às '+n[0].h};
  }
  return{title:'Hoje não há treino agendado',sub:'Nenhum horário fixo encontrado. Fale com o seu personal.'};

function freqCard(a){
  if(isOnl(a)){
    return '<div class="card"><div class="row"><b>Acompanhamento Online</b><span class="tag ok">Ativo</span></div>'+
      '<p class="mut" style="margin:6px 0 0">Mantenha a constância nos treinos da semana e envie seu feedback ao personal sempre que concluir o ciclo.</p></div>';
  }
  var now=new Date(),sun0=weekStartSun(now);
  var wkDone=0,wkPlan=0;
  for(var di=0;di<7;di++){
    var cur=new Date(sun0.getFullYear(),sun0.getMonth(),sun0.getDate()+di);
    var ds=iso(cur);
    dayItems(ds,a.id).forEach(function(it){
      if(!it.rep)wkPlan++;
      if(S.reg[it.k]==='p')wkDone++;
    });
  }
  var mPref=mes();
  var yNum=parseInt(mPref.slice(0,4),10),mIdx=parseInt(mPref.slice(5,7),10)-1;

      var st=S.reg[it.k];
      if(st==='p'){mDone++;mClosed++}
      else if(st==='f'||st==='j'){mClosed++}
    });
  }
  var pctMes=mClosed?Math.round((mDone/mClosed)*100):100;
  var pctBar=wkPlan?Math.min(100,Math.round((wkDone/wkPlan)*100)):0;
  var msg=wkPlan===0?'Seus horários fixos aparecerão aqui assim que a grade estiver ativa.':

/* ---------- reposições (calendário) ---------- */
function calHTML(list,targetMonth){
  var m=ui.mon,t=hoje(),curM=mes(),f1=new Date(m.y,m.m,1),days=new Date(m.y,m.m+1,0).getDate(),off=f1.getDay();
  var monStr=m.y+'-'+pad(m.m+1);
  var disPrev=monStr<=curM;
  var disNext=!!ui.maxMonth&&monStr>=ui.maxMonth;
  var hasRep={};list.forEach(function(r){hasRep[r.data]=1});
  var h='<div class="cal-wrap"><div class="cal-hdr"><button class="b sm" '+(disPrev?'disabled ':'')+'onclick="monthNav(-1)" aria-label="Mês anterior">‹</button><h2>'+MESES[m.m]+' '+m.y+'</h2><button class="b sm" '+(disNext?'disabled ':'')+'onclick="monthNav(1)" aria-label="Próximo mês">›</button></div>';
  h+='<div class="cal">'+['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(function(x){return '<div class="dw">'+x+'</div>'}).join('');
  for(var i=0;i<off;i++)h+='<span></span>';
  for(var d=1;d<=days;d++){
    var ds=m.y+'-'+pad(m.m+1)+'-'+pad(d);
    var cls=(ds===t?' today':'')+(ds===ui.day?' sel':'');
    var dis=ds<t||(!!targetMonth&&ds.slice(0,7)!==targetMonth);
    h+='<button class="'+cls.trim()+'" '+(dis?'disabled ':'')+'onclick="pickDay(\''+ds+'\')" aria-label="'+d+' de '+MESES[m.m]+'">'+d+(hasRep[ds]?'<span class="dot"></span>':'')+'</button>';
  }
  return h+'</div></div>';
}
function monthNav(d){
  var m=ui.mon,n=new Date(m.y,m.m+d,1),c=new Date();
  if(n<new Date(c.getFullYear(),c.getMonth(),1))return;
  var nextStr=n.getFullYear()+'-'+pad(n.getMonth()+1);
  if(ui.maxMonth&&nextStr>ui.maxMonth)return;
  ui.mon={y:n.getFullYear(),m:n.getMonth()};
  snap();
}
function pickDay(ds){ui.day=ds;snap()}
function repArea(aluno){
  var t=hoje(),curM=mes();
  if(!ui.mon){var n=new Date();ui.mon={y:n.getFullYear(),m:n.getMonth()}}
  if(!ui.day||ui.day<t)ui.day=t;
  ui.scope=aluno?aluno.id:null;
  var inScope=function(r){return isPres(al(r.a))&&(!aluno||r.a===aluno.id)};
  var allPend=S.rep.filter(function(r){return !r.data&&inScope(r)});
  var pend=aluno?allPend.filter(isRepValidaAluno):allPend;
  var expiredCount=aluno?(allPend.length-pend.length):0;
  var all=S.rep.filter(function(r){return r.data&&inScope(r)});
  var sch=all.filter(function(r){return r.data>=t}).sort(function(x,y){return x.data<y.data?-1:x.data>y.data?1:(x.h<y.h?-1:x.h>y.h?1:0)});
  if(ui.sel&&!pend.some(function(r){return r.id===ui.sel}))ui.sel=null;
  var pick=pickId(ui.scope);
  var pickObj=pick?pend.find(function(r){return r.id===pick}):null;
  var targetMonth=aluno?(pickObj?repMesRef(pickObj):curM):null;
  ui.maxMonth=aluno?pend.reduce(function(mx,r){var rm=repMesRef(r);return rm>mx?rm:mx},curM):null;
  if(aluno&&targetMonth){
    var monStr=ui.mon.y+'-'+pad(ui.mon.m+1);
    if(monStr<curM||(ui.maxMonth&&monStr>ui.maxMonth)){
      ui.mon={y:parseInt(targetMonth.slice(0,4),10),m:parseInt(targetMonth.slice(5,7),10)-1};
    }
    if(ui.day.slice(0,7)!==targetMonth){
      ui.day=(targetMonth===curM)?t:(targetMonth+'-01');
      ui.mon={y:parseInt(targetMonth.slice(0,4),10),m:parseInt(targetMonth.slice(5,7),10)-1};
    }
  }
  var slots=slotsFor(ui.day,aluno?12:0);
  var outOfAllowedMonth=!!(aluno&&targetMonth&&ui.day.slice(0,7)!==targetMonth);
  var h=aluno?comoAgendarCard():'';
  h+='<div class="card">'+calHTML(all,targetMonth)+'</div>';
  h+='<div class="card"><div class="row"><b>Horários livres · '+fd(ui.day)+'</b>'+(aluno?'<span class="mut">Mín. 12h antes · mesmo mês</span>':'')+'</div>';
  if(!pend.length)h+='<p class="mut" style="margin:8px 0 0">Nenhuma reposição pendente para agendar'+(aluno?' neste mês':'')+'.</p>';
  else if(!pick)h+='<p class="mut" style="margin:8px 0 0">Escolha abaixo a reposição que vai agendar.</p>';
  if(outOfAllowedMonth){
    h+='<div class="slots" style="margin-top:10px"><span class="mut">Agendamento permitido somente dentro do próprio mês do crédito (não acumula para o mês seguinte).</span></div>';
  }else{
    h+='<div class="slots" style="margin-top:10px">'+(slots.length?slots.map(function(s){return '<button '+(pick?'':'disabled ')+'onclick="schedSlot(\''+s+'\')">'+s+'</button>'}).join(''):'<span class="mut">Sem horários livres neste dia'+(aluno?' (respeitando 12h de antecedência)':'')+'.</span>')+'</div>';
  }
  if(!aluno)h+='<div class="btns" style="margin-top:12px"><input id="rep-extra" type="time" aria-label="Horário extra"><button class="b sm" '+(pick?'':'disabled ')+'onclick="schedExtra()">Agendar em horário extra</button></div>';
  h+='</div>';
  if(pend.length){
    h+='<h2 class="h">A agendar ('+pend.length+')</h2>'+pend.map(function(r){
      var a=al(r.a),on=pick===r.id;
      return '<div class="card"><div class="row"><b>'+(aluno?'Aula perdida':esc(a?a.nome:''))+'</b><span class="mut">'+(r.orig?'Falta em '+fd(r.orig):'')+'</span></div><div class="btns"><button class="b sm '+(on?'p':'')+'" onclick="selRep(\''+r.id+'\')">'+(on?'Selecionada':'Selecionar para agendar')+'</button></div></div>';
    }).join('');
  }
  if(expiredCount>0){
    h+='<div class="card"><span class="mut">'+expiredCount+' aula(s) em haver de mês(es) anterior(es) expiraram pela regra de não-cumulatividade mensal.</span></div>';
  }
  h+='<h2 class="h">Agendadas ('+sch.length+')</h2>'+(sch.length?sch.map(function(r){
    var a=al(r.a);
    return '<div class="card"><div class="row"><b>'+(aluno?'Minha reposição':esc(a?a.nome:''))+'</b><span class="tag rep">'+fd(r.data)+' às '+r.h+'</span></div><div class="btns"><button class="b sm" onclick="unsched(\''+r.id+'\')">Desmarcar</button></div></div>';
  }).join(''):'<div class="empty">Nada agendado.</div>');
  return h;
}

function detectChanges(){
  var curReg=Object.assign({},S.reg);
  var curRep={};
  S.rep.forEach(function(r){curRep[r.id]={a:r.a,data:r.data||'',h:r.h||'',orig:r.orig||''}});
  if(!prevSnap){
    prevSnap={reg:curReg,rep:curRep};
    return;
  }
  var now=new Date(),hm=pad(now.getDate())+'/'+pad(now.getMonth()+1)+' '+pad(now.getHours())+':'+pad(now.getMinutes());
  var added=0;
  Object.keys(curReg).forEach(function(k){
    if(prevSnap.reg[k]!==curReg[k]&&curReg[k]){
      var aid=k.charAt(0)==='R'?(S.rep.find(function(r){return r.id===k.slice(1)})||{}).a:k.split('|')[0];
      var a=al(aid);
      if(!a)return;
      var dtStr=k.charAt(0)==='R'?'':fd(k.split('|')[1])+' às '+k.split('|')[2];
      var desc=curReg[k]==='j'?'Avisou que vai faltar'+(dtStr?' ('+dtStr+')':''):
               (curReg[k]==='p'?'Presença confirmada'+(dtStr?' ('+dtStr+')':''):'Falta registrada'+(dtStr?' ('+dtStr+')':''));
      var dup=ui.feed.some(function(f){return f.aluno===a.nome&&f.msg.indexOf(desc)===0&&!f.read});
      if(!dup){
        ui.feed.unshift({id:'n_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),aluno:a.nome,msg:desc,hora:hm,read:false});
        added++;
      }
    }
  });
  Object.keys(curRep).forEach(function(id){
    var prev=prevSnap.rep[id],cur=curRep[id];
    var a=al(cur.a);
    if(!a)return;
    var msgTxt='';
    if((!prev||!prev.data)&&cur.data){
      msgTxt='Agendou reposição para '+fd(cur.data)+' às '+cur.h+'.';
    }else if(prev&&prev.data&&!cur.data){
      msgTxt='Desmarcou reposição de '+fd(prev.data)+' às '+prev.h+'.';
    }
    if(msgTxt){
      var dupR=ui.feed.some(function(f){return f.aluno===a.nome&&f.msg===msgTxt&&!f.read});
      if(!dupR){
        ui.feed.unshift({id:'n_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),aluno:a.nome,msg:msgTxt,hora:hm,read:false});
        added++;
      }
    }
  });
  if(ui.feed.length>40)ui.feed.length=40;
  if(added>0)persistFeedState();
  prevSnap={reg:curReg,rep:curRep};
}
function studentView(){
  var a=myAluno();
  if(!a)return OWNER?'<div class="empty">Cadastre um aluno para visualizar a área do aluno.</div>':loginView();
  var body=ui.tab==='aulas'?aulasView(a):(ui.tab==='rep'?repArea(a):homeView(a));
  var foot='<div class="aluno-foot"><button onclick="openChangePassModal(myAluno())">Trocar senha</button>'+(!OWNER?' · <button onclick="signOutApp()">Sair</button>':'')+'</div>';
  return body+foot;
}
function render(){
  var app=document.getElementById('app');
  var seg=document.getElementById('seg');
  var nav=document.getElementById('nav');
  var fab=document.getElementById('fab');
  var subWrap=document.getElementById('hdr-sub-wrap');
  var subEl=document.getElementById('hdr-sub');
  var hdrLogo=document.getElementById('hdr-logo');
  if(hdrLogo&&!hdrLogo.innerHTML)hdrLogo.innerHTML=logoSvg('hdr');

  if(!UID){
    seg.hidden=true;
    nav.innerHTML='';
    document.body.classList.remove('nav-on');
    fab.hidden=true;
    if(subWrap)subWrap.hidden=true;
    document.getElementById('brand').textContent='Diário do Personal';
    app.innerHTML=authView();
    renderBell();
    return;
  }
  if(!OWNER)ui.role='a';
  var T=TABS[ui.role];
  if(!T.some(function(x){return x[0]===ui.tab}))ui.tab=T[0][0];

  if(ui.role==='p'){
    if(subWrap)subWrap.hidden=false;
    if(subEl)subEl.textContent='GESTÃO & PERFORMANCE';
    document.getElementById('brand').textContent='Diário do Personal';
  }else if(myAluno()){
    if(subWrap)subWrap.hidden=false;
    if(subEl)subEl.textContent='DIÁRIO DO PERSONAL';
    document.getElementById('brand').textContent=activeBrand();
  }else{
    if(subWrap)subWrap.hidden=true;
    document.getElementById('brand').textContent='Diário do Personal';
  }

  if(OWNER){
    seg.hidden=false;
    seg.innerHTML='<button onclick="signOutApp()">Sair</button>';
  }else seg.hidden=true;

  app.innerHTML=ui.role==='p'?personalView():studentView();
  var showNav=ui.role==='p'||!!myAluno();
  nav.innerHTML=showNav?T.map(function(x){
    return '<button type="button" class="tab-btn'+(ui.tab===x[0]?' on':'')+'" onclick="tab(\''+x[0]+'\')"><span class="i">'+x[1]+'</span><span class="t">'+x[2]+'</span></button>';
  }).join(''):'';
  document.body.classList.toggle('nav-on',showNav);

  var wa=activeWhatsApp();
  if(ui.role==='a'&&!!myAluno()&&wa){
    fab.href=waLink(wa,'Olá '+firstName({nome:activeBrand()})+'! Vim pelo app Diário do Personal');
    fab.hidden=false;
  }else{
    fab.hidden=true;
  }
  renderBell();
}
function snap(){
  var keep={};
  document.querySelectorAll('#app input, #app select').forEach(function(el){if(el.id&&el.type!=='checkbox')keep[el.id]=el.value});
  var y=window.scrollY;
  render();
  Object.keys(keep).forEach(function(id){var el=document.getElementById(id);if(el)el.value=keep[id]});
  window.scrollTo(0,y);
}
function tab(t){ui.tab=t;render();window.scrollTo(0,0)}
function role(r){ui.role=r;ui.tab=TABS[r][0][0];ui.login='';render();window.scrollTo(0,0)}
function go(d){var b=pd(ui.date);b.setDate(b.getDate()+d);ui.date=iso(b);ui.repDow=pd(ui.date).getDay();render();window.scrollTo(0,0)}
function goHoje(){ui.date=hoje();ui.repDow=pd(ui.date).getDay();render()}

function notify(){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    var t=hoje();
    if(S.lemb===t)return;
    var l=[];
    if(OWNER){
      l=S.alunos.filter(function(a){var p=pay(a);return p.s==='atrasado'||(p.s==='aberto'&&p.d<=3)});
    }else{
      var me=myAluno();
      if(me){var p=pay(me);if(p.s==='atrasado'||(p.s==='aberto'&&p.d<=3))l=[me]}
    }
    if(!l.length)return;
    S.lemb=t;
    try{localStorage.setItem('diario_personal_l',t)}catch(e){}
    new Notification('Diário do Personal',{body:OWNER?l.length+' mensalidade(s) vencendo ou atrasadas.':'Sua mensalidade está próxima do vencimento.'});
  }catch(e){}
}

async function refreshAll(){
  if(!UID)return;

  // Verifica se o usuário logado é um Personal Trainer
  var perRes=await sb.from('personais').select('user_id,nome_profissional,whatsapp,pix_key,piloto_ate,ativo,is_super_admin').eq('user_id',UID).maybeSingle();

  // Fallback de onboarding caso o usuário tenha confirmado e-mail após o signUp como personal
  if(!perRes.data){
    try{
      var pendPers=localStorage.getItem('diario_pending_personal');
      if(pendPers){
        var pdObj=JSON.parse(pendPers);
        if(pdObj&&pdObj.nome_profissional){
          await sb.rpc('criar_perfil_personal',{
            p_nome_profissional:pdObj.nome_profissional,
            p_whatsapp:pdObj.whatsapp||'',
            p_pix_key:pdObj.pix_key||''
          });
          localStorage.removeItem('diario_pending_personal');
          perRes=await sb.from('personais').select('user_id,nome_profissional,whatsapp,pix_key,piloto_ate,ativo,is_super_admin').eq('user_id',UID).maybeSingle();
        }
      }
    }catch(e){}
  }

  OWNER=!!(perRes.data&&perRes.data.user_id);
  ui.role=OWNER?'p':'a';
  S.perfil=perRes.data||null;

  var vincRes=await sb.from('vinculos').select('user_id,aluno_id,personal_id').eq(OWNER?'personal_id':'user_id',UID);
  S.vinc={};
  var myPersonalId=OWNER?UID:null;
  (vincRes.data||[]).forEach(function(v){
    S.vinc[v.user_id]=v.aluno_id;
    if(!OWNER&&v.personal_id)myPersonalId=v.personal_id;
  });
  S.personalId=myPersonalId;

  // Se for aluno vinculado, carrega os dados públicos do SEU Personal (nome, WhatsApp e Pix)
  if(!OWNER&&myPersonalId){
    var pStuRes=await sb.from('personais').select('user_id,nome_profissional,whatsapp,pix_key,piloto_ate,ativo').eq('user_id',myPersonalId).maybeSingle();
    S.perfil=pStuRes.data||null;
  }

  S.repSlots={};
  if(myPersonalId){
    var cfgRes=await sb.from('app_config').select('chave,valor').eq('personal_id',myPersonalId).in('chave',['rep_slots_dow']);
    (cfgRes.data||[]).forEach(function(row){
      if(row.chave==='rep_slots_dow'&&row.valor){
        try{
          var parsed=JSON.parse(row.valor);
          if(parsed&&typeof parsed==='object'){S.repSlots=parsed;saveLocalRepSlots()}
        }catch(e){}
      }
    });
    if(!Object.keys(S.repSlots).length){
      var loc=loadLocalRepSlots();
      if(loc)S.repSlots=loc;
    }
  }

  if(!OWNER&&!S.vinc[UID]){
    S.alunos=[];S.aulas=[];S.rep=[];S.reg={};S.pagos={};S.tel={};S.codigos={};S.occPersonal=[];
    loaded=true;
    snap();
    return;
  }

  var tenantCol=OWNER?'personal_id':'id';
  var tenantVal=OWNER?UID:S.vinc[UID];

  var alunosRes=await sb.from('alunos').select('id,nome,tipo,valor,venc').eq(tenantCol,tenantVal);
  S.alunos=(alunosRes.data||[]).map(function(x){
    return {id:x.id,nome:x.nome,tipo:x.tipo,valor:Number(x.valor||0),venc:Number(x.venc||10)};
  });

  var childCol=OWNER?'personal_id':'aluno_id';
  var childVal=OWNER?UID:S.vinc[UID];

  var aulasRes=await sb.from('aulas').select('id,aluno_id,dow,hora').eq(childCol,childVal);
  S.aulas=(aulasRes.data||[]).map(function(x){
    return {id:x.id,a:x.aluno_id,dow:Number(x.dow),h:normTime(x.hora)};
  });

  var repRes=await sb.from('reposicoes').select('id,aluno_id,falta_data,falta_hora,data,hora').eq(childCol,childVal);
  S.rep=(repRes.data||[]).map(function(r){
    return {id:r.id,a:r.aluno_id,orig:r.falta_data,data:r.data||null,h:r.hora?normTime(r.hora):null};
  });

  var presRes=await sb.from('presencas').select('aluno_id,data,hora,status,is_reposicao').eq(childCol,childVal);
  S.reg={};
  (presRes.data||[]).forEach(function(p){
    var hh=normTime(p.hora);
    var k=p.aluno_id+'|'+p.data+'|'+hh;
    S.reg[k]=p.status;
    if(p.is_reposicao){
      var matched=S.rep.find(function(r){return r.a===p.aluno_id&&r.data===p.data&&r.h===hh});
      if(matched)S.reg['R'+matched.id]=p.status;
    }
  });

  var pagRes=await sb.from('pagamentos').select('aluno_id,mes').eq(childCol,childVal);
  S.pagos={};
  (pagRes.data||[]).forEach(function(pg){
    S.pagos[pg.aluno_id+'|'+pg.mes]=pg.aluno_id+'|'+pg.mes;
  });

  S.tel={};
  S.codigos={};
  S.occPersonal=[];
  if(OWNER){
    var contRes=await sb.from('contatos').select('aluno_id,telefone').eq('personal_id',UID);
    (contRes.data||[]).forEach(function(c){if(c.telefone)S.tel[c.aluno_id]=c.telefone});

    var codRes=await sb.from('codigos_acesso').select('aluno_id,codigo').eq('personal_id',UID);
    (codRes.data||[]).forEach(function(c){if(c.codigo)S.codigos[c.aluno_id]=c.codigo});
  }else{
    var occRes=await sb.rpc('agenda_ocupacao_personal');
    if(!occRes.error&&Array.isArray(occRes.data))S.occPersonal=occRes.data;
  }

  loaded=true;
  if(OWNER){
    await syncFeedFromCloud();
    detectChanges();
  }
  if(!notified){notified=true;notify()}
  snap();
}

(async function boot(){
  ui.date=hoje();
  try{S.lemb=localStorage.getItem('diario_personal_l')||''}catch(e){}
  try{
    var savedTheme=localStorage.getItem('diario_personal_theme');
    if(savedTheme==='dark'||savedTheme==='light')applyTheme(savedTheme);
    else applyTheme(null);
  }catch(e){applyTheme(null)}

  sb.auth.onAuthStateChange(async function(_event,session){
    SESSION=session;
    UID=session&&session.user?session.user.id:null;
    if(UID){
      await refreshAll();
      if(!pollTimer)pollTimer=setInterval(refreshAll,20000);
    }else{
      OWNER=false;prevSnap=null;
      if(pollTimer){clearInterval(pollTimer);pollTimer=null}
      render();
    }
  });

  var cur=await sb.auth.getSession();
  SESSION=cur.data&&cur.data.session?cur.data.session:null;
  UID=SESSION&&SESSION.user?SESSION.user.id:null;
  if(UID){
    await refreshAll();
    pollTimer=setInterval(refreshAll,20000);
  }else{
    render();
  }
})();
</script>
