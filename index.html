function pad(n){return(n<10?'0':'')+n}

  var pool={};
  // 1. Horários liberados manualmente pelo Personal para este dia da semana
  var manual=(S.repSlots&&Array.isArray(S.repSlots[d]))?S.repSlots[d]:[];
  manual.forEach(function(h){pool[normTime(h)]=1});
  // 2. Horários liberados automaticamente quando um aluno avisou falta com antecedência nesta data
  S.aulas.forEach(function(x){
    if(x.dow!==d||!isPres(al(x.a)))return;
    var k=x.a+'|'+date+'|'+x.h;
    if(S.reg[k]==='j')pool[normTime(x.h)]=1;
  });
  return Object.keys(pool).sort().filter(function(hm){
    if(o[hm]||o[hm.slice(0,2)])return false;
    if(isT){
      var parts=hm.split(':');
      var mins=(parseInt(parts[0],10)||0)*60+(parseInt(parts[1],10)||0);
      if(mins<=nm)return false;
    }
    return true;
  });
}
function pickId(aid){
  var pend=S.rep.filter(function(r){return !r.data&&isPres(al(r.a))&&(!aid||r.a===aid)});
  if(ui.sel&&pend.some(function(r){return r.id===ui.sel}))return ui.sel;
  return pend.length===1?pend[0].id:null;
}

function copyPix(){
  var done=function(){ui.pixAt=Date.now();snap();setTimeout(snap,2300)};
  var fallback=function(){
    var ta=document.createElement('textarea');
    ta.value=PIX;ta.setAttribute('readonly','');
    ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();
    var ok=false;try{ok=document.execCommand('copy')}catch(e){}
    document.body.removeChild(ta);
    if(ok)done();else showMsg('Não foi possível copiar. Chave Pix: '+PIX);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(PIX).then(done,fallback)}
  else fallback();
}

function stCls(st){return st==='p'?'ok':st==='j'?'warn':'bad'}
function stTxt(st){return st==='p'?'Presente':st==='j'?'Falta avisada':'Faltou'}
function statusHoje(a){
  if(isOnl(a))return{title:'Consultoria online',sub:'Seu acompanhamento não tem horário fixo na agenda. Siga o treino e as orientações passadas pelo seu personal.'};
  var t=hoje(),now=new Date(),nowHM=pad(now.getHours())+':'+pad(now.getMinutes());
  var its=dayItems(t,a.id).filter(function(i){return i.h>nowHM});
  if(its.length){
    var it=its[0],st=S.reg[it.k];
    return{title:'Hoje você tem treino às '+it.h,sub:(it.rep?'Reposição agendada':'Treino fixo')+(st==='j'?' · falta avisada':'')};
  }
  for(var i=1;i<=60;i++){
    var b=new Date();b.setDate(b.getDate()+i);
    var d=iso(b),n=dayItems(d,a.id);
    if(n.length)return{title:'Hoje não há treino agendado',sub:'Próximo treino: '+fd(d)+' às '+n[0].h};
  }
  return{title:'Hoje não há treino agendado',sub:'Nenhum horário fixo encontrado. Fale com o seu personal.'};
}

function comoAgendarCard(){

    '<ol class="rules"><li>Selecione abaixo a aula pendente em <b>A agendar</b>.</li><li>Escolha no calendário o <b>dia desejado</b> para repor o treino.</li><li>Toque em um dos <b>horários disponíveis</b> (incluindo vagas liberadas por aviso prévio de outros alunos) para confirmar.</li></ol></div>';
}
function freqCard(a){
  if(isOnl(a)){
    return '<div class="card"><div class="row"><b>Acompanhamento Online</b><span class="tag ok">Ativo</span></div>'+
      '<p class="mut" style="margin:6px 0 0">Mantenha a constância nos treinos da semana e envie seu feedback ao personal sempre que concluir o ciclo.</p></div>';
  }
  var now=new Date(),sun0=weekStartSun(now);
  var wkDone=0,wkPlan=0;
  for(var di=0;di<7;di++){
    var cur=new Date(sun0.getFullYear(),sun0.getMonth(),sun0.getDate()+di);
    var ds=iso(cur);
    dayItems(ds,a.id).forEach(function(it){
      if(!it.rep)wkPlan++;
      if(S.reg[it.k]==='p')wkDone++;
    });
  }
  var mPref=mes();
  var yNum=parseInt(mPref.slice(0,4),10),mIdx=parseInt(mPref.slice(5,7),10)-1;
  var daysInMonth=new Date(yNum,mIdx+1,0).getDate();
  var mDone=0,mClosed=0;
  for(var d=1;d<=daysInMonth;d++){
    var dsM=mPref+'-'+pad(d);
    dayItems(dsM,a.id).forEach(function(it){
      var st=S.reg[it.k];
      if(st==='p'){mDone++;mClosed++}
      else if(st==='f'||st==='j'){mClosed++}
    });
  }
  var pctMes=mClosed?Math.round((mDone/mClosed)*100):100;
  var pctBar=wkPlan?Math.min(100,Math.round((wkDone/wkPlan)*100)):0;
  var msg=wkPlan===0?'Seus horários fixos aparecerão aqui assim que a grade estiver ativa.':
    (wkDone>=wkPlan?'Meta semanal concluída! Excelente constância nos treinos.':
    (wkDone>0?'Bom ritmo! Faltam '+(wkPlan-wkDone)+' treino(s) para fechar sua meta da semana.':'Sua semana está aberta. Bora cumprir os '+wkPlan+' treino(s) programados!'));
  return '<div class="card">'+
    '<div class="row"><b>Frequência e constância</b><span class="tag ok">'+pctMes+'% no mês</span></div>'+
    '<div class="big" style="margin-top:6px">'+wkDone+' de '+wkPlan+' treino(s) na semana</div>'+
    '<div class="prog-track" role="progressbar" aria-valuenow="'+pctBar+'" aria-valuemin="0" aria-valuemax="100"><div class="prog-fill" style="width:'+pctBar+'%"></div></div>'+
    '<div class="mut">'+esc(msg)+'</div>'+
    '</div>';
}

function weekStartSun(dt){

  d.setDate(d.getDate()-d.getDay());
  return d;
}
function aulasView(a){
  if(!isPres(a))return '<div class="empty">Consultoria online: não há aulas na agenda.</div>';
  var now=new Date(),tIso=hoje(),sun0=weekStartSun(now);
  var h='<div class="row" style="margin-bottom:8px"><h2 class="h" style="margin:0">Semana de aulas (Dom → Sáb)</h2><span class="mut">Arraste p/ o lado ↔</span></div>';
  h+='<div class="wk-strip">';
  for(var w=0;w<4;w++){
    var ws=new Date(sun0.getFullYear(),sun0.getMonth(),sun0.getDate()+w*7);
    var we=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+6);
    var wLbl=w===0?'Semana atual':(w===1?'Próxima semana':'Em '+w+' semanas');
    h+='<div class="wk-pane">';
    h+='<div class="row"><b>'+wLbl+'</b><span class="mut">'+pad(ws.getDate())+'/'+pad(ws.getMonth()+1)+' a '+pad(we.getDate())+'/'+pad(we.getMonth()+1)+'</span></div>';
    h+='<div class="wk-grid">';
    for(var di=0;di<7;di++){
      var cur=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+di);
      var ds=iso(cur);
      var its=dayItems(ds,a.id);
      var cls='wk-day'+(ds===tIso?' today':'');
      var sub='—';
      if(its.length){
        var hasP=its.some(function(it){return S.reg[it.k]==='p'});
        var hasJ=its.some(function(it){return S.reg[it.k]==='j'});
        var hasF=its.some(function(it){return S.reg[it.k]==='f'});
        var hasRep=its.some(function(it){return it.rep});
        if(hasP){cls+=' st-p';sub='Treinou'}
        else if(hasJ){cls+=' st-j';sub='Repor'}
        else if(hasF){cls+=' st-f';sub='Faltou'}
        else if(hasRep){cls+=' st-rep';sub='Rep. '+its[0].h}
        else{sub=its[0].h}
      }
      h+='<div class="'+cls+'"><span class="wd">'+DOW[di].slice(0,3)+'</span><span class="wn">'+pad(cur.getDate())+'</span><span class="ws">'+sub+'</span></div>';
    }
    h+='</div>';
    h+='<div class="wk-leg">'+
      '<span><i style="background:var(--ok)"></i>Treinou</span>'+
      '<span><i style="background:#FFC700;border:1px solid #d4a300"></i>Falta avisada (repor)</span>'+
      '<span><i style="background:var(--bad)"></i>Faltou s/ aviso</span>'+
      '<span><i style="background:#14213D"></i>Reposição</span>'+
    '</div>';
    h+='</div>';
  }
  h+='</div>';

  // Status do mês abaixo do calendário semanal
  var mPref=mes();
  var yNum=parseInt(mPref.slice(0,4),10),mIdx=parseInt(mPref.slice(5,7),10)-1;
  var daysInMonth=new Date(yNum,mIdx+1,0).getDate();
  var presCount=0,faltasAviso=0,faltasSemAviso=0;
  for(var d=1;d<=daysInMonth;d++){
    var dsM=mPref+'-'+pad(d);
    dayItems(dsM,a.id).forEach(function(it){
      var st=S.reg[it.k];
      if(!it.rep){
        if(st==='p')presCount++;
        else if(st==='j')faltasAviso++;
        else if(st==='f')faltasSemAviso++;
      }
    });
  }
  var repMes=S.rep.filter(function(r){return r.a===a.id&&r.data&&r.data.slice(0,7)===mPref});
  var repRealizadas=repMes.filter(function(r){return S.reg['R'+r.id]==='p'}).length;
  var repAgendadas=repMes.filter(function(r){return S.reg['R'+r.id]!=='p'}).length;

  h+='<div class="card" style="margin-top:12px">';
  h+='<div class="row"><h3>Status do mês · '+MESES[mIdx]+'</h3></div>';
  h+='<div class="mstat">';

  h+='<div class="mstat-box"><span class="mut">Faltas ('+faltasAviso+' avisada · '+faltasSemAviso+' s/ aviso)</span><b style="color:var(--bad)">'+(faltasAviso+faltasSemAviso)+'</b></div>';

  h+='<div class="mstat-box"><span class="mut">Reposições realizadas</span><b style="color:var(--ok)">'+repRealizadas+'</b></div>';
  h+='</div></div>';

  // Lista das próximas aulas para o aluno avisar falta com antecedência
  var prox='';
  for(var i=0;i<14;i++){
    var b=new Date();b.setDate(b.getDate()+i);
    var dStr=iso(b);
    dayItems(dStr,a.id).forEach(function(it){prox+=itemCard(it,dStr,true)});
  }
  if(prox){
    h+='<h2 class="h">Próximas aulas (avisar falta)</h2>'+prox;
  }
  return h;
}

    '<div class="err" role="alert">'+esc(ui.authErr)+'</div>'+
    '<div class="btns" style="justify-content:center"><button class="b p" onclick="'+(isReg?'signUpEmail()':'signInEmail()')+'" style="width:100%">'+(isReg?'Cadastrar conta':'Entrar')+'</button></div>'+
    '<div class="btns" style="justify-content:center"><button class="b sm" onclick="ui.authMode=\''+(isReg?'login':'signup')+'\';ui.authErr=\'\';snap()">'+(isReg?'Já tenho conta · Entrar':'Primeiro acesso · Criar conta')+'</button></div>'+
    '</div></div>';
}
function loginView(){
  if(!UID)return authView();
  return '<div class="login"><div class="card"><h2>Bem-vindo(a)</h2>'+
    '<p class="mut" style="margin:6px 0 14px">Digite o código de acesso de 6 dígitos que o seu personal passou para entrar na sua área.</p>'+
    '<input id="l-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000" aria-label="Código de acesso" onkeydown="if(event.key===\'Enter\')claimCode()">'+
    '<div class="err" role="alert">'+esc(ui.login)+'</div>'+
    '<div class="btns" style="justify-content:center"><button class="b p" onclick="claimCode()" style="width:100%">Entrar</button></div>'+
    '<div class="btns" style="justify-content:center"><button class="b sm" onclick="signOutApp()">Sair da conta</button></div></div></div>';
}

/* ---------- reposições (calendário) ---------- */
function calHTML(list){
  var m=ui.mon,t=hoje(),f1=new Date(m.y,m.m,1),days=new Date(m.y,m.m+1,0).getDate(),off=f1.getDay();
  var hasRep={};list.forEach(function(r){hasRep[r.data]=1});
  var h='<div class="date"><button class="b sm" onclick="monthNav(-1)" aria-label="Mês anterior">‹</button><h2>'+MESES[m.m]+' '+m.y+'</h2><button class="b sm" onclick="monthNav(1)" aria-label="Próximo mês">›</button></div>';
  h+='<div class="cal">'+['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(function(x){return '<div class="dw">'+x+'</div>'}).join('');
  for(var i=0;i<off;i++)h+='<span></span>';
  for(var d=1;d<=days;d++){
    var ds=m.y+'-'+pad(m.m+1)+'-'+pad(d);
    var cls=(ds===t?' today':'')+(ds===ui.day?' sel':'');
    h+='<button class="'+cls.trim()+'" '+(ds<t?'disabled ':'')+'onclick="pickDay(\''+ds+'\')" aria-label="'+d+' de '+MESES[m.m]+'">'+d+(hasRep[ds]?'<span class="dot"></span>':'')+'</button>';
  }
  return h+'</div>';
}
function monthNav(d){
  var m=ui.mon,n=new Date(m.y,m.m+d,1),c=new Date();
  if(n<new Date(c.getFullYear(),c.getMonth(),1))return;
  ui.mon={y:n.getFullYear(),m:n.getMonth()};
  snap();
}
function pickDay(ds){ui.day=ds;snap()}
function repArea(aluno){
  var t=hoje();
  if(!ui.mon){var n=new Date();ui.mon={y:n.getFullYear(),m:n.getMonth()}}
  if(!ui.day||ui.day<t)ui.day=t;
  ui.scope=aluno?aluno.id:null;
  var inScope=function(r){return isPres(al(r.a))&&(!aluno||r.a===aluno.id)};
  var pend=S.rep.filter(function(r){return !r.data&&inScope(r)});
  var all=S.rep.filter(function(r){return r.data&&inScope(r)});
  var sch=all.filter(function(r){return r.data>=t}).sort(function(x,y){return x.data<y.data?-1:x.data>y.data?1:(x.h<y.h?-1:x.h>y.h?1:0)});
  if(ui.sel&&!pend.some(function(r){return r.id===ui.sel}))ui.sel=null;
  var pick=pickId(ui.scope),slots=slotsFor(ui.day);
  var h=aluno?comoAgendarCard():'';
  h+='<div class="card">'+calHTML(all)+'</div>';
  h+='<div class="card"><div class="row"><b>Horários livres · '+fd(ui.day)+'</b></div>';
  if(!pend.length)h+='<p class="mut" style="margin:8px 0 0">Nenhuma reposição pendente para agendar.</p>';
  else if(!pick)h+='<p class="mut" style="margin:8px 0 0">Escolha abaixo a reposição que vai agendar.</p>';
  h+='<div class="slots" style="margin-top:10px">'+(slots.length?slots.map(function(s){return '<button '+(pick?'':'disabled ')+'onclick="schedSlot(\''+s+'\')">'+s+'</button>'}).join(''):'<span class="mut">Sem horários livres neste dia.</span>')+'</div>';
  if(!aluno)h+='<div class="btns" style="margin-top:12px"><input id="rep-extra" type="time" aria-label="Horário extra"><button class="b sm" '+(pick?'':'disabled ')+'onclick="schedExtra()">Agendar em horário extra</button></div>';
  h+='</div>';
  if(pend.length){
    h+='<h2 class="h">A agendar ('+pend.length+')</h2>'+pend.map(function(r){
      var a=al(r.a),on=pick===r.id;
      return '<div class="card"><div class="row"><b>'+(aluno?'Aula perdida':esc(a?a.nome:''))+'</b><span class="mut">'+(r.orig?'Falta em '+fd(r.orig):'')+'</span></div><div class="btns"><button class="b sm '+(on?'p':'')+'" onclick="selRep(\''+r.id+'\')">'+(on?'Selecionada':'Selecionar para agendar')+'</button></div></div>';
    }).join('');
  }
  h+='<h2 class="h">Agendadas ('+sch.length+')</h2>'+(sch.length?sch.map(function(r){
    var a=al(r.a);
    return '<div class="card"><div class="row"><b>'+(aluno?'Minha reposição':esc(a?a.nome:''))+'</b><span class="tag rep">'+fd(r.data)+' às '+r.h+'</span></div><div class="btns"><button class="b sm" onclick="unsched(\''+r.id+'\')">Desmarcar</button></div></div>';
  }).join(''):'<div class="empty">Nada agendado.</div>');
  return h;
}

/* ---------- telas do personal ---------- */
function vAgenda(){
  var its=dayItems(ui.date,null);
  var activeDow=ui.repDow!==null?ui.repDow:pd(ui.date).getDay();
  var manualList=(S.repSlots&&Array.isArray(S.repSlots[activeDow]))?S.repSlots[activeDow]:[];
  var baseHours=[];
  for(var hh=6;hh<=21;hh++)baseHours.push(pad(hh)+':00');
  var extraHours=manualList.filter(function(h){return baseHours.indexOf(h)<0});

  var h='<div class="date"><button class="b sm" onclick="go(-1)" aria-label="Dia anterior">‹</button><h2>'+(ui.date===hoje()?'Hoje · ':'')+fd(ui.date)+'</h2><button class="b sm" onclick="go(1)" aria-label="Próximo dia">›</button></div>';
  if(ui.date!==hoje())h+='<div style="text-align:center;margin-bottom:10px"><button class="b sm" onclick="goHoje()">Voltar para hoje</button></div>';
  h+=its.length?its.map(function(i){return itemCard(i,ui.date,false)}).join(''):'<div class="empty">Nenhuma aula presencial neste dia.</div>';

  // Painel de disponibilização manual de horários para reposição por dia da semana
  h+='<div class="card" style="margin-top:16px">';
  h+='<div class="row"><h3>Horários disponíveis para reposição</h3><span class="tag rep">'+manualList.length+' ativo(s)</span></div>';
  h+='<p class="mut" style="margin:6px 0 0">Selecione o dia da semana e toque nos horários que deseja liberar na aba Reposições dos alunos.</p>';
  h+='<div class="dow-pills">'+DOW.map(function(d,i){
    return '<button class="'+(activeDow===i?'on':'')+'" onclick="ui.repDow='+i+';snap()">'+d.slice(0,3)+'</button>';
  }).join('')+'</div>';
  h+='<div class="mut">Configurando: <b>'+DOW[activeDow]+'</b></div>';
  h+='<div class="slot-tog">'+baseHours.map(function(hr){
    var on=manualList.indexOf(hr)>=0;
    return '<button class="'+(on?'on':'')+'" onclick="toggleRepSlotDow('+activeDow+',\''+hr+'\')">'+hr+'</button>';
  }).join('')+'</div>';
  if(extraHours.length){
    h+='<div style="margin-top:10px">'+extraHours.map(function(hr){
      return '<span class="chip">'+hr+'<button onclick="toggleRepSlotDow('+activeDow+',\''+hr+'\')" aria-label="Remover horário">×</button></span>';
    }).join('')+'</div>';
  }
  h+='<div class="btns" style="margin-top:12px"><input type="time" id="rep-custom-h" aria-label="Horário personalizado"><button class="b sm p" onclick="addCustomRepSlot('+activeDow+')">Adicionar horário</button></div>';
  h+='</div>';
  return h;
}
function vAlunos(){
  var h='<div class="card"><h3>Novo aluno</h3><div class="f" style="margin-top:8px">'+
    '<input class="w" id="f-nome" placeholder="Nome completo">'+
    '<select id="f-tipo" aria-label="Modalidade"><option value="presencial">Presencial</option><option value="online">Online</option></select>'+
    '<input id="f-tel" inputmode="tel" placeholder="WhatsApp com DDD">'+
    '<input id="f-valor" inputmode="decimal" placeholder="Mensalidade (R$)">'+
    '<input class="w" id="f-venc" inputmode="numeric" placeholder="Dia do vencimento (1 a 28)">'+
    '</div><div class="btns"><button class="b p" onclick="addAluno()">Salvar aluno</button></div></div>';
  if(!S.alunos.length)return h+'<div class="empty">Nenhum aluno cadastrado ainda.</div>';
  var linked=linkedIds();
  S.alunos.slice().sort(byNome).forEach(function(a){
    var on=isOnl(a),ln=linked[a.id],cod=codeOf(a);
    var grade=S.aulas.filter(function(x){return x.a===a.id}).sort(sortAula);
    h+='<div class="card"><div class="row"><b>'+esc(a.nome)+'</b><span class="tag '+(on?'':'ok')+'">'+(on?'Online':'Presencial')+'</span></div>'+
      '<div class="mut" style="margin-top:4px">'+brl(a.valor)+' · vence dia '+a.venc+' · Código <b>'+esc(cod)+'</b> · <span class="tag '+(ln?'ok':'')+'">'+(ln?'Vinculado':'Aguardando')+'</span></div>';
    if(on){
      h+='<div class="mut" style="margin-top:8px">Consultoria online · sem grade fixa.</div>';
    }else{
      h+='<div style="margin-top:8px">'+(grade.map(chip).join('')||'<span class="mut">Sem horários na grade.</span>')+'</div>'+
        '<div class="btns"><select id="sd'+a.id+'" aria-label="Dia da semana">'+DOW.map(function(d,i){return '<option value="'+i+'">'+d+'</option>'}).join('')+'</select><input type="time" id="sh'+a.id+'" value="07:00" aria-label="Horário"><button class="b sm p" onclick="addAula(\''+a.id+'\')">Adicionar horário</button></div>';
    }
    h+='<div class="btns"><button class="b sm" onclick="rmAluno(\''+a.id+'\')">Excluir aluno</button></div></div>';
  });
  return h;
}
function listaPagto(lst,online){
  if(!lst.length)return '<div class="empty">'+(online?'Nenhum aluno de consultoria online ainda. Cadastre um aluno como Online na aba Alunos.':'Nenhum aluno presencial cadastrado.')+'</div>';
  var rec=0,ab=0;
  lst.forEach(function(a){if(pay(a).s==='pago')rec+=a.valor||0;else ab+=a.valor||0});
  var linked=linkedIds();
  var h='<div class="sum"><div class="card"><span class="mut">Recebido no mês</span><b>'+brl(rec)+'</b></div><div class="card"><span class="mut">Em aberto</span><b>'+brl(ab)+'</b></div></div>';
  lst.slice().sort(function(x,y){return ord(x)-ord(y)}).forEach(function(a){
    var p=pay(a),pg=p.s==='pago',ln=linked[a.id],cod=codeOf(a);
    h+='<div class="card"><div class="row"><b>'+esc(a.nome)+'</b>'+payTxt(a)+'</div>'+
      '<div class="mut" style="margin-top:4px">'+brl(a.valor)+' · vencimento '+dmy(p.due)+'</div>'+
      (online?'<div class="mut" style="margin-top:4px">Código <b>'+esc(cod)+'</b> · <span class="tag '+(ln?'ok':'')+'">'+(ln?'Acessou':'Aguardando acesso')+'</span></div>':'')+
      '<div class="btns"><button class="b sm '+(pg?'':'p')+'" onclick="togglePay(\''+a.id+'\')">'+(pg?'Desfazer pagamento':'Marcar como pago')+'</button>'+
      (pg?'':'<button class="b sm" onclick="cobrar(\''+a.id+'\')">Cobrar no WhatsApp</button>')+
      (online?'<button class="b sm" onclick="enviarCodigo(\''+a.id+'\')">Enviar código</button>':'')+'</div></div>';
  });
  return h;
}

/* ---------- navegação e renderização ---------- */
function personalView(){
  var late=S.alunos.filter(function(a){return pay(a).s==='atrasado'}).length;
  var h=(late&&ui.tab!=='pag'&&ui.tab!=='online')?'<div class="alert">'+late+' aluno(s) com mensalidade atrasada. Veja Pagamentos e Consultoria Online.</div>':'';
  if(ui.tab==='alunos')return h+vAlunos();
  if(ui.tab==='rep')return h+repArea(null);
  if(ui.tab==='online')return h+listaPagto(S.alunos.filter(isOnl),true);
  if(ui.tab==='pag')return h+listaPagto(S.alunos.filter(isPres),false);
  return h+vAgenda();
}
function picker(){
  return '<div class="card"><label class="mut" for="pk">Visualizando como</label><br><select id="pk" onchange="ui.aluno=this.value;snap()">'+
    S.alunos.slice().sort(byNome).map(function(a){return '<option value="'+a.id+'"'+(a.id===ui.aluno?' selected':'')+'>'+esc(a.nome)+'</option>'}).join('')+'</select></div>';
}
function studentView(){
  var a=myAluno();
  if(!a)return OWNER?'<div class="empty">Cadastre um aluno para visualizar a área do aluno.</div>':loginView();
  var pk=OWNER?picker():'';
  if(ui.tab==='aulas')return pk+aulasView(a);
  if(ui.tab==='rep')return pk+repArea(a);
  return pk+homeView(a);
}
function render(){
  var app=document.getElementById('app');
  var seg=document.getElementById('seg');
  var nav=document.getElementById('nav');
  if(!UID){
    seg.hidden=true;
    nav.innerHTML='';
    document.body.classList.remove('nav-on');
    document.getElementById('fab').hidden=true;
    document.getElementById('brand').textContent='Diário do Personal';
    app.innerHTML=authView();
    return;
  }
  if(!OWNER)ui.role='a';
  var T=TABS[ui.role];
  if(!T.some(function(x){return x[0]===ui.tab}))ui.tab=T[0][0];
  document.getElementById('brand').textContent=ui.role==='a'?'Danilo Luiz / Personal Trainer':'Diário do Personal';
  if(OWNER){
    seg.hidden=false;
    seg.innerHTML='<button class="'+(ui.role==='p'?'on':'')+'" onclick="role(\'p\')">Personal</button><button class="'+(ui.role==='a'?'on':'')+'" onclick="role(\'a\')">Aluno</button><button onclick="signOutApp()">Sair</button>';
  }else seg.hidden=true;
  app.innerHTML=ui.role==='p'?personalView():studentView();
  var showNav=ui.role==='p'||!!myAluno();
  nav.innerHTML=showNav?T.map(function(x){
    return '<button class="'+(ui.tab===x[0]?'on':'')+'" onclick="tab(\''+x[0]+'\')"><span class="i">'+x[1]+'</span>'+x[2]+'</button>';
  }).join(''):'';
  document.body.classList.toggle('nav-on',showNav);
  document.getElementById('fab').hidden=ui.role!=='a';
}
function snap(){
  var keep={};
  document.querySelectorAll('#app input, #app select').forEach(function(el){if(el.id&&el.type!=='checkbox')keep[el.id]=el.value});
  var y=window.scrollY;
  render();
  Object.keys(keep).forEach(function(id){var el=document.getElementById(id);if(el)el.value=keep[id]});
  window.scrollTo(0,y);
}
function tab(t){ui.tab=t;render();window.scrollTo(0,0)}
function role(r){ui.role=r;ui.tab=TABS[r][0][0];ui.login='';render();window.scrollTo(0,0)}
function go(d){var b=pd(ui.date);b.setDate(b.getDate()+d);ui.date=iso(b);ui.repDow=pd(ui.date).getDay();render();window.scrollTo(0,0)}
function goHoje(){ui.date=hoje();ui.repDow=pd(ui.date).getDay();render()}

function notify(){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    var t=hoje();
    if(S.lemb===t)return;
    var l=[];
    if(OWNER){
      l=S.alunos.filter(function(a){var p=pay(a);return p.s==='atrasado'||(p.s==='aberto'&&p.d<=3)});
    }else{
      var me=myAluno();
      if(me){var p=pay(me);if(p.s==='atrasado'||(p.s==='aberto'&&p.d<=3))l=[me]}
    }
    if(!l.length)return;
    S.lemb=t;
    try{localStorage.setItem('diario_personal_l',t)}catch(e){}
    new Notification('Diário do Personal',{body:OWNER?l.length+' mensalidade(s) vencendo ou atrasadas.':'Sua mensalidade está próxima do vencimento.'});
  }catch(e){}
}

async function refreshAll(){
  if(!UID)return;
  var admRes=await sb.from('admins').select('user_id').eq('user_id',UID).maybeSingle();
  OWNER=!!(admRes.data&&admRes.data.user_id);
  ui.role=OWNER?(ui.role||'p'):'a';

  var cfgRes=await sb.from('app_config').select('chave,valor').in('chave',['pix_key','rep_slots_dow']);
  (cfgRes.data||[]).forEach(function(row){
    if(row.chave==='pix_key'&&row.valor)PIX=row.valor;
    if(row.chave==='rep_slots_dow'&&row.valor){
      try{
        var parsed=JSON.parse(row.valor);
        if(parsed&&typeof parsed==='object'){S.repSlots=parsed;saveLocalRepSlots()}
      }catch(e){}
    }
  });
  if(!S.repSlots||!Object.keys(S.repSlots).length){
    var loc=loadLocalRepSlots();
    if(loc)S.repSlots=loc;
  }

  var alunosRes=await sb.from('alunos').select('id,nome,tipo,valor,venc');
  S.alunos=(alunosRes.data||[]).map(function(x){
    return {id:x.id,nome:x.nome,tipo:x.tipo,valor:Number(x.valor||0),venc:Number(x.venc||10)};
  });

  var aulasRes=await sb.from('aulas').select('id,aluno_id,dow,hora');
  S.aulas=(aulasRes.data||[]).map(function(x){
    return {id:x.id,a:x.aluno_id,dow:Number(x.dow),h:normTime(x.hora)};
  });

  var repRes=await sb.from('reposicoes').select('id,aluno_id,falta_data,falta_hora,data,hora');
  S.rep=(repRes.data||[]).map(function(r){
    return {id:r.id,a:r.aluno_id,orig:r.falta_data,data:r.data||null,h:r.hora?normTime(r.hora):null};
  });

  var presRes=await sb.from('presencas').select('aluno_id,data,hora,status,is_reposicao');
  S.reg={};
  (presRes.data||[]).forEach(function(p){
    var hh=normTime(p.hora);
    var k=p.aluno_id+'|'+p.data+'|'+hh;
    S.reg[k]=p.status;
    if(p.is_reposicao){
      var matched=S.rep.find(function(r){return r.a===p.aluno_id&&r.data===p.data&&r.h===hh});
      if(matched)S.reg['R'+matched.id]=p.status;
    }
  });

  var pagRes=await sb.from('pagamentos').select('aluno_id,mes');
  S.pagos={};
  (pagRes.data||[]).forEach(function(pg){
    S.pagos[pg.aluno_id+'|'+pg.mes]=pg.aluno_id+'|'+pg.mes;
  });

  var vincRes=await sb.from('vinculos').select('user_id,aluno_id');
  S.vinc={};
  (vincRes.data||[]).forEach(function(v){
    S.vinc[v.user_id]=v.aluno_id;
  });

  S.tel={};
  S.codigos={};
  if(OWNER){
    var contRes=await sb.from('contatos').select('aluno_id,telefone');
    (contRes.data||[]).forEach(function(c){if(c.telefone)S.tel[c.aluno_id]=c.telefone});

    var codRes=await sb.from('codigos_acesso').select('aluno_id,codigo');
    (codRes.data||[]).forEach(function(c){if(c.codigo)S.codigos[c.aluno_id]=c.codigo});
  }

  loaded=true;
  if(!notified){notified=true;notify()}
  snap();
}

(async function boot(){
  ui.date=hoje();
  try{S.lemb=localStorage.getItem('diario_personal_l')||''}catch(e){}

  sb.auth.onAuthStateChange(async function(_event,session){
    SESSION=session;
    UID=session&&session.user?session.user.id:null;
    if(UID){
      await refreshAll();
      if(!pollTimer)pollTimer=setInterval(refreshAll,20000);
    }else{
      OWNER=false;
      if(pollTimer){clearInterval(pollTimer);pollTimer=null}
      render();
    }
  });

  var cur=await sb.auth.getSession();
  SESSION=cur.data&&cur.data.session?cur.data.session:null;
  UID=SESSION&&SESSION.user?SESSION.user.id:null;
  if(UID){
    await refreshAll();
    pollTimer=setInterval(refreshAll,20000);
  }else{
    render();
  }
})();
</script>
